<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>মাছের খামার</title>
<meta name="theme-color" content="#1f7a43">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --g1: #14532d; --g2: #1f7a43; --g3: #2e9d5a; --g4: #3fbf6a;
    --mint: #e8f6ec; --line: #d3e7da; --ink: #1d2a22; --muted: #5b6b61;
    --bg: #f2f9f4; --red: #b42318; --redbg: #fdecea;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Noto Sans Bengali", system-ui, sans-serif;
    background: linear-gradient(180deg, #eaf8ee 0%, var(--bg) 40%, #f7fbf8 100%);
    color: var(--ink); min-height: 100vh; line-height: 1.5;
  }
  [hidden] { display: none !important; }

  header.top {
    background: linear-gradient(90deg, #15673a, var(--g2) 60%, #23874d);
    color: #fff; display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 12px rgba(20, 83, 45, .28);
  }
  header.top h1 { font-size: 1.25em; margin: 0; font-weight: 800; letter-spacing: .2px; }
  .back {
    background: rgba(255, 255, 255, .18); border: 0; color: #fff;
    width: 38px; height: 38px; border-radius: 50%; font-size: 1.3em; cursor: pointer; flex: none;
  }
  .back:focus-visible, .tile:focus-visible, .fin-strip:focus-visible, .btn:focus-visible { outline: 3px solid var(--g4); outline-offset: 2px; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }

  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 18px;
    padding: 16px; box-shadow: 0 2px 10px rgba(20, 83, 45, .06);
  }
  .section { margin-top: 16px; }
  h2.sec { font-size: 1.05em; color: var(--g1); margin: 0 0 12px; }

  /* উপরের সারসংক্ষেপ: ছবি + ৪টি তথ্য এক সারিতে */
  .hero { display: grid; grid-template-columns: 1fr 3fr; padding: 0; overflow: hidden;
    background: linear-gradient(90deg, #f7fff9, #eefaf2 70%, #e2f5e8); }
  .hero-photo img { display: block; width: 100%; height: 100%; min-height: 104px; max-height: 132px; object-fit: cover; }
  .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; }
  .hstat { display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 8px 4px; border-left: 1px solid var(--line); }
  .hstat img { height: 46px; width: auto; max-width: 100%; object-fit: contain; }
  .hstat .k { font-size: .75em; color: var(--muted); margin-top: 2px; line-height: 1.3; }
  .hstat .v { font-weight: 800; color: var(--g1); font-size: 1em; line-height: 1.3; }

  /* মেনু: ৩ কলাম, ২ সারি */
  .menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
  .tile {
    display: flex; align-items: center; gap: 8px; min-width: 0; text-align: left;
    cursor: pointer; font: inherit; color: inherit;
    background: linear-gradient(180deg, #ffffff, #f6fcf8); border: 1px solid var(--line);
    border-radius: 16px; padding: 8px 10px; box-shadow: 0 2px 8px rgba(20, 83, 45, .06);
    transition: transform .15s, box-shadow .15s;
  }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(20, 83, 45, .14); }
  .tile .art { width: 56px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; }
  .tile .art img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .tile .t { flex: 1; min-width: 0; font-weight: 700; color: var(--g1); font-size: .85em; line-height: 1.3; }
  .tile .arr {
    flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: var(--g2); color: #fff; font-size: 1.05em; font-weight: 700;
  }
  .tile.hi { border: 2px solid var(--g4); background: linear-gradient(135deg, #f3fff6, #ffffff); }

  /* নিচের আর্থিক সারসংক্ষেপ */
  .fin-strip { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); padding: 8px 4px;
    cursor: pointer; font: inherit; color: inherit; text-align: left; }
  .fin-strip.plain { cursor: default; }
  .fin-i { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-left: 1px solid var(--line); min-width: 0; }
  .fin-i:first-child { border-left: 0; }
  .fin-i img { width: 40px; height: 40px; object-fit: contain; flex: none; }
  .fin-i small { display: block; color: var(--muted); font-size: .75em; line-height: 1.3; }
  .fin-i b { display: block; color: var(--g1); font-size: .95em; line-height: 1.3; }
  .fin-i b.neg { color: var(--red); }

  .stat { text-align: center; padding: 8px 6px; border-left: 1px solid var(--line); }
  .stat:first-child { border-left: 0; }
  .stat .k { font-size: .85em; color: var(--muted); }
  .stat .v { font-size: 1.35em; font-weight: 800; color: var(--g1); }
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); padding: 10px 8px; }

  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form .full { grid-column: 1 / -1; }
  label.f { font-size: .9em; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
  input, select {
    font: inherit; font-size: 1rem; color: var(--ink);
    padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fbfefc; width: 100%;
  }
  input:focus, select:focus { outline: 2px solid var(--g3); border-color: transparent; }
  .btn {
    background: linear-gradient(90deg, var(--g2), var(--g3)); color: #fff; border: 0;
    border-radius: 999px; padding: 12px 22px; font: inherit; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 12px rgba(31, 122, 67, .3);
  }
  .btn.ghost { background: var(--mint); color: var(--g1); box-shadow: none; }

  .pill { position: relative; display: inline-block; }
  .pill input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .pill span {
    display: inline-block; padding: 9px 18px; border-radius: 999px;
    background: var(--mint); color: var(--g1); font-weight: 600; cursor: pointer;
  }
  .pill input:checked + span { background: var(--g2); color: #fff; }
  .pill input:focus-visible + span { outline: 3px solid var(--g3); outline-offset: 2px; }
  .pills { display: flex; gap: 10px; flex-wrap: wrap; }

  .preview {
    background: linear-gradient(90deg, #e8f6ec, #f7fff9); border: 1px dashed var(--g3);
    border-radius: 14px; padding: 12px 14px;
  }
  .preview .calc { font-size: .95em; color: var(--muted); }
  .preview .amt { font-size: 1.5em; font-weight: 800; color: var(--g1); }

  .list .item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .list .item:last-child { border-bottom: 0; }
  .item .main { flex: 1; min-width: 0; }
  .item .meta { color: var(--muted); font-size: .88em; }
  .del {
    background: var(--redbg); color: var(--red); border: 0; border-radius: 10px;
    padding: 7px 12px; font: inherit; font-size: .9em; cursor: pointer; flex: none;
  }
  .empty { color: var(--muted); text-align: center; padding: 18px 8px; }
  .note { color: var(--muted); font-size: .88em; margin: 8px 0 0; }

  .chip { padding: 2px 10px; border-radius: 999px; font-size: .8em; font-weight: 700; white-space: nowrap; }
  .chip.ok { background: #dff5e6; color: var(--g1); }
  .chip.bad { background: var(--redbg); color: var(--red); }

  .tbl { width: 100%; border-collapse: collapse; font-size: .95em; }
  .tbl th, .tbl td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  .tbl th { color: var(--g1); background: var(--mint); font-weight: 700; }
  .tbl td.n { text-align: right; font-weight: 700; color: var(--g1); }
  .scroll { overflow-x: auto; }

  @media (max-width: 600px) {
    .hero { grid-template-columns: 1fr; }
    .hero-photo img { min-height: 88px; max-height: 96px; }
    .hstat img { height: 34px; }
    .hstat .k { font-size: .7em; }
    .hstat .v { font-size: .9em; }
    .tile { padding: 6px 7px; gap: 6px; }
    .tile .art { width: 44px; height: 44px; }
    .tile .t { font-size: .78em; }
    .tile .arr { width: 22px; height: 22px; font-size: .95em; }
    .fin-i img { width: 32px; height: 32px; }
    .fin-i small { font-size: .7em; }
    .fin-i b { font-size: .85em; }
    .summary { grid-template-columns: 1fr 1fr; row-gap: 10px; }
    .stat:nth-child(odd) { border-left: 0; }
  }
  @media print {
    header.top, .btn, .del, form, .menu, .fin-strip, .no-print { display: none !important; }
    body { background: #fff; }
    .card { box-shadow: none; }
  }
</style>
</head>
<body>

<header class="top">
  <button class="back" id="back" type="button" aria-label="পেছনে" hidden>‹</button>
  <h1 id="title">মাছের খামার</h1>
</header>

<main id="app"></main>

// ---------- ডেটা সংরক্ষণ (এই ব্রাউজারে). পরে Firebase-এর সঙ্গে যুক্ত হবে ----------
const KEY = 'fishFarm.v1';
const empty = () => ({ ponds: [], stocks: [], feed: [], health: [], water: [], sales: [], expenses: [] });
let db = load();
function load() {
  try { return Object.assign(empty(), JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch (e) { return empty(); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }

// ---------- সাহায্যকারী ----------
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toISOString().slice(0, 10);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const bn = (n) => Number(n || 0).toLocaleString('bn-BD', { maximumFractionDigits: 2 });
const money = (n) => '৳ ' + Number(n || 0).toLocaleString('bn-BD', { maximumFractionDigits: 0 });
const sum = (arr, f) => arr.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const pondName = (id) => (db.ponds.find((p) => p.id === id) || {}).name || 'মুছে ফেলা পুকুর';

function pondFish(pid) {
  const stock = sum(db.stocks.filter((s) => s.pondId === pid), (s) => s.count);
  const dead = sum(db.health.filter((h) => h.pondId === pid), (h) => h.deaths);
  const sold = sum(db.sales.filter((s) => s.pondId === pid && s.mode === 'piece'), (s) => s.qty);
  return Math.max(0, stock - dead - sold);
}

function totals() {
  const ym = today().slice(0, 7);
  const feedIn = sum(db.feed.filter((f) => f.type === 'in'), (f) => f.kg);
  const feedOut = sum(db.feed.filter((f) => f.type === 'out'), (f) => f.kg);
  const totalSales = sum(db.sales, (s) => s.total);
  const feedCost = sum(db.feed.filter((f) => f.type === 'in'), (f) => f.price);
  const totalExp = sum(db.expenses, (e) => e.amount) + feedCost;
  return {
    ponds: db.ponds.length,
    fishNow: db.ponds.reduce((s, p) => s + pondFish(p.id), 0),
    feedStock: feedIn - feedOut, feedIn, feedOut, feedCost,
    monthSales: sum(db.sales.filter((s) => s.date && s.date.startsWith(ym)), (s) => s.total),
    totalSales, totalExp, profit: totalSales - totalExp,
  };
}

const WATER = {
  temp: { label: 'তাপমাত্রা', unit: '°C', lo: 25, hi: 32 },
  ph:   { label: 'pH', unit: '', lo: 6.5, hi: 8.5 },
  dox:  { label: 'অক্সিজেন (DO)', unit: 'mg/L', lo: 5, hi: 99 },
  amm:  { label: 'অ্যামোনিয়া', unit: 'mg/L', lo: 0, hi: 0.05 },
};
function chip(key, v) {
  if (v === null || v === undefined || v === '') return '<span class="note">—</span>';
  const r = WATER[key];
  const ok = Number(v) >= r.lo && Number(v) <= r.hi;
  return `<span class="chip ${ok ? 'ok' : 'bad'}">${bn(v)} ${r.unit} · ${ok ? 'ভালো' : 'সতর্ক'}</span>`;
}
function latestWater(pid) {
  return db.water.filter((w) => w.pondId === pid).sort((a, b) => b.date.localeCompare(a.date))[0];
}
function pondSelect() {
  if (!db.ponds.length) return '<select name="pondId" disabled><option>আগে একটি পুকুর যোগ করুন</option></select>';
  return '<select name="pondId" required><option value="">পুকুর নির্বাচন করুন</option>' +
    db.ponds.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('') + '</select>';
}

function stat(k, v) { return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`; }
function hstat(icon, k, v) {
  return `<div class="hstat"><img src="${icon}" alt=""><span class="k">${k}</span><span class="v">${v}</span></div>`;
}
function tile(id, art, title, cls = '') {

}
function delBtn(kind, id) { return `<button class="del" data-del="${kind}" data-id="${id}" type="button">মুছুন</button>`; }

// ---------- বিক্রয় হিসাব (পিস / কেজি) ----------
function updateSale(form) {
  if (!form) return;
  const mode = form.querySelector('input[name="mode"]:checked').value;
  const qty = Number(form.qty.value) || 0;
  const unit = Number(form.unit.value) || 0;
  form.querySelector('[data-qlabel]').textContent = mode === 'piece' ? 'বিক্রীত মাছ (পিস)' : 'বিক্রীত ওজন (কেজি)';
  form.querySelector('[data-ulabel]').textContent = mode === 'piece' ? 'প্রতি পিস দাম (৳)' : 'প্রতি কেজি দাম (৳)';
  form.querySelector('[data-calc]').textContent = mode === 'piece'
    ? `${bn(qty)} পিস × ${money(unit)} = `
    : `${bn(qty)} কেজি × ${money(unit)} = `;
  form.querySelector('[data-amt]').textContent = money(qty * unit);
}

// ---------- ফর্ম সেভ ----------
const HANDLERS = {
  pond(d) {
    if (!d.name.trim()) return false;
    db.ponds.push({ id: uid(), name: d.name.trim(), area: Number(d.area) || 0, depth: Number(d.depth) || 0, date: d.date || today() });
  },
  stock(d) {
    if (!d.pondId || !(Number(d.count) >= 0)) return false;
    db.stocks.push({ id: uid(), pondId: d.pondId, species: (d.species || '').trim(), count: Number(d.count) || 0, avgKg: Number(d.avgKg) || 0, date: d.date || today() });
  },
  feed(d) {
    const kg = Number(d.kg);
    if (!(kg > 0)) return false;
    db.feed.push({ id: uid(), type: d.type, kg, price: d.type === 'in' ? (Number(d.price) || 0) : 0, date: d.date || today() });
  },
  water(d) {
    if (!d.pondId) return false;
    const num = (v) => (v === '' || v === undefined ? null : Number(v));
    db.water.push({ id: uid(), pondId: d.pondId, temp: num(d.temp), ph: num(d.ph), dox: num(d.dox), amm: num(d.amm), date: d.date || today() });
  },
  health(d) {
    if (!d.pondId) return false;
    db.health.push({ id: uid(), pondId: d.pondId, type: d.type, deaths: Number(d.deaths) || 0, medicine: (d.medicine || '').trim(), note: (d.note || '').trim(), date: d.date || today() });
  },
  sale(d) {
    const qty = Number(d.qty), unit = Number(d.unit);
    if (!d.pondId || !(qty > 0) || !(unit >= 0)) return false;
    db.sales.push({ id: uid(), pondId: d.pondId, mode: d.mode, qty, unit, total: qty * unit, date: d.date || today() });
  },
  expense(d) {
    const amount = Number(d.amount);
    if (!(amount > 0)) return false;
    db.expenses.push({ id: uid(), item: (d.item || '').trim(), amount, date: d.date || today() });
  },
};
const LISTS = { stock: 'stocks', feed: 'feed', health: 'health', water: 'water', sale: 'sales', expense: 'expenses' };

function removeItem(kind, id) {
  if (kind === 'pond') {
    db.ponds = db.ponds.filter((p) => p.id !== id);
    db.stocks = db.stocks.filter((s) => s.pondId !== id);
    db.health = db.health.filter((h) => h.pondId !== id);
    db.water = db.water.filter((w) => w.pondId !== id);
  } else {
    const key = LISTS[kind];
    db[key] = db[key].filter((x) => x.id !== id);
  }
  save();
}

// ---------- পাতা চালানো ----------
let view = 'home';
const app = document.getElementById('app');
const titleEl = document.getElementById('title');
const backBtn = document.getElementById('back');

function render() {
  titleEl.textContent = TITLES[view];
  backBtn.hidden = view === 'home';
  app.innerHTML = VIEWS[view]();
  if (view === 'finance') updateSale(app.querySelector('form[data-form="sale"]'));
}
function go(name) {
  view = name in VIEWS ? name : 'home';
  window.scrollTo(0, 0);
  render();
}
backBtn.addEventListener('click', () => go('home'));

document.addEventListener('click', (e) => {
  const goEl = e.target.closest('[data-go]');
  if (goEl) return go(goEl.dataset.go);

  const del = e.target.closest('[data-del]');
  if (del) {
    const msg = del.dataset.del === 'pond'
      ? 'এই পুকুর ও এর মাছ, খাবার-পানি-স্বাস্থ্যের তথ্য মুছে যাবে। নিশ্চিত?'
      : 'এই রেকর্ডটি মুছে যাবে। নিশ্চিত?';
    if (!confirm(msg)) return;
    removeItem(del.dataset.del, del.dataset.id);
    return render();
  }
  if (e.target.closest('[data-action="print"]')) window.print();
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  if (HANDLERS[form.dataset.form](data) === false) { alert('তথ্যগুলো ঠিকভাবে দিন।'); return; }
  save();
  render();
});
document.addEventListener('input', (e) => {
  const form = e.target.closest('form[data-form="sale"]');
  if (form) updateSale(form);
});
document.addEventListener('change', (e) => {
  if (e.target.name === 'mode') updateSale(e.target.closest('form'));
});

render();
</script>
