<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পোল্ট্রি ফার্ম ম্যানেজমেন্ট প্রো</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2d6a3e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; overflow-x: hidden; }

        /* ===== ভেতরের অ্যাপের স্টাইল (শুধু #app-screen এর ভেতরে, লগইন পেজে প্রভাব নেই) ===== */
        #app-screen{--bg:#f4f6f1;--sf:#fff;--ink:#1c2a21;--mu:#455549;--ln:#d6ddd1;--ac:#2d6a3e;--ai:#fff;--go:#c8962b;--rd:#a63a2b;
            background:var(--bg);color:var(--ink);font:400 18px/1.7 "Noto Sans Bengali","Hind Siliguri","Kalpurush","Nirmala UI","Vrinda",sans-serif;min-height:100vh;
            padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
        @media (prefers-color-scheme:dark){#app-screen{--bg:#121915;--sf:#1c2720;--ink:#e8efe6;--mu:#bccbbf;--ln:#33443a;--ac:#6fbf82;--ai:#10200f;--go:#e0b550;--rd:#e68a7b;color-scheme:dark}}
        #app-screen *{box-sizing:border-box}
        #app-screen main{max-width:760px;margin:0 auto;padding:12px 14px 60px}
        #app-screen .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;padding:10px 12px;border-radius:16px;background:linear-gradient(135deg,#17402a,#2d6a3e);color:#fff;box-shadow:0 4px 14px rgba(23,64,42,.3)}
        #app-screen button.prof{display:flex;align-items:center;gap:12px;background:none;border:0;color:#fff;padding:0;text-align:left;min-width:0;flex:1}
        #app-screen .who{display:block;min-width:0}
        #app-screen .who b{display:block;font-size:1.15rem;font-weight:600;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        #app-screen .who small{display:inline-block;font-size:.85rem;background:rgba(255,255,255,.18);padding:0 10px;border-radius:10px;line-height:1.5}
        #app-screen button.logout{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);padding:8px 12px;flex:none}
        #app-screen .avatar{width:48px;height:48px;border-radius:50%;background:#e6f0e8;color:#17402a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;overflow:hidden;border:2px solid rgba(255,255,255,.9);flex:none}
        #app-screen .avatar img{width:100%;height:100%;object-fit:cover;display:block}
        #app-screen .avatar.big{width:104px;height:104px;font-size:2.4rem;margin:0 auto 8px;border-color:var(--ln)}
        #app-screen .proh{text-align:center}
        #app-screen .proh .pname{font-size:1.4rem;font-weight:700}
        #app-screen .pbtns{margin-top:10px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
        #app-screen label.fbtn{display:inline-block;cursor:pointer;border:1px solid var(--ac);border-radius:8px;padding:8px 16px;color:var(--ac);background:var(--sf);margin:0;font-weight:600}
        #app-screen input[readonly]{opacity:.7}
        #app-screen header{display:flex;gap:8px;margin-bottom:10px}
        #app-screen header select{flex:1;font-weight:700}
        #app-screen nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
        #app-screen nav button{white-space:nowrap;font-size:1.05rem;padding:9px 14px}
        #app-screen nav button.on{background:var(--ac);color:var(--ai);border-color:var(--ac)}
/* ডেস্কটপ (বড় স্ক্রিন): বাম দিকে মেনু, ডান দিকে কন্টেন্ট */
@media(min-width:1024px){
  #app-screen main{max-width:1280px;display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-areas:"top top" "nav hdr" "nav view";column-gap:22px;row-gap:0;align-items:start}
  #app-screen .top{grid-area:top;margin-bottom:16px}
  #app-screen header{grid-area:hdr;margin-bottom:12px}
  #app-screen nav{grid-area:nav;flex-direction:column;overflow:visible;padding-bottom:0;position:sticky;top:12px;gap:6px}
  #app-screen nav button{width:100%;text-align:left;white-space:normal;font-size:1rem;padding:10px 14px}
  #app-screen #v{grid-area:view;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  #app-screen #v>*{grid-column:1/-1;min-width:0}
  #app-screen #v>section,#app-screen #v>.pc,#app-screen #v>.card{grid-column:span 1}
}
@media(min-width:1024px) and (max-width:1199px){
  #app-screen main{grid-template-columns:200px minmax(0,1fr)}
}
        #app-screen #strip{background:var(--go);color:#1c1a10;border-radius:10px;padding:8px 12px;margin:4px 0 12px;font-weight:600}
        #app-screen #strip:empty{display:none}
        #app-screen section{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
        #app-screen h2{font-size:1.35rem;line-height:1.5;margin:0 0 10px;font-weight:700}
        #app-screen label{display:block;font-size:1.05rem;color:var(--mu);margin-bottom:8px}
        #app-screen input,#app-screen select,#app-screen textarea{display:block;width:100%;margin-top:3px;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
        #app-screen input:focus,#app-screen select:focus,#app-screen button:focus-visible,#app-screen textarea:focus{outline:2px solid var(--go);outline-offset:1px}
        #app-screen button{font:inherit;font-weight:500;cursor:pointer;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:8px 12px}
        #app-screen button.p{background:var(--ac);color:var(--ai);border-color:var(--ac);width:100%;padding:11px;font-weight:600}
        #app-screen button.s{padding:4px 10px;font-size:1rem;margin-left:6px}
        #app-screen button.d{color:var(--rd)}
        #app-screen button:disabled{opacity:.6;cursor:wait}
        #app-screen .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        #app-screen .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
        @media(max-width:430px){#app-screen .g3{grid-template-columns:1fr 1fr}}
        #app-screen .card{border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:10px}
        #app-screen .big{font-size:1.85rem;font-weight:700;line-height:1.4}
        #app-screen .mu{color:var(--mu);font-size:1.03rem}
        #app-screen .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.88rem;background:var(--go);color:#1c1a10}
        #app-screen .row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}
        #app-screen .k{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--ln)}
        #app-screen .pos{color:var(--ac)}
        #app-screen .neg{color:var(--rd)}
        #app-screen #ans{white-space:pre-wrap;margin-top:10px}
        #app-screen .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
        #app-screen .hub{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
        #app-screen button.hubc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;color:#fff;border:0;padding:14px 12px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
        #app-screen button.hubc i{font-size:1.6rem;opacity:.95}
        #app-screen button.hubc b{display:block;font-size:1.3rem}
        #app-screen button.hubc small{display:block;font-size:.95rem;opacity:.92;line-height:1.3}
        #app-screen button.hubc.ai{background:linear-gradient(135deg,#0f766e,#2d6a3e)}
        #app-screen button.hubc.pg{background:linear-gradient(135deg,#b45309,#c2410c)}
        #app-screen button.back{margin-bottom:10px}
        #app-screen .aihead{background:linear-gradient(135deg,#0f766e,#2d6a3e);color:#fff;border:0}
        #app-screen .aihead.pgh{background:linear-gradient(135deg,#b45309,#c2410c)}
        #app-screen .aihead h2{margin-bottom:4px}
        #app-screen .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
        #app-screen .seg button{padding:10px 4px;font-size:1.02rem}
        #app-screen .seg button.on{background:var(--ac);color:var(--ai);border-color:var(--ac)}
        #app-screen .ans{white-space:pre-wrap;margin-top:4px}

        /* সেভ/ত্রুটির মেসেজ (টোস্ট) বড় করা হলো */
        #toast-box{max-width:32rem}
        #toast-content{font-size:1.3rem;line-height:1.5;font-weight:700;padding:18px 22px}
        #toast-icon{font-size:1.6rem}
        #app-screen button.hubc.tk{background:linear-gradient(135deg,#1d4ed8,#4338ca);grid-column:1/-1}
        #app-screen .aihead.tkh{background:linear-gradient(135deg,#1d4ed8,#4338ca)}

        /* ===== নতুন হোম (ড্যাশবোর্ড) ===== */
        #app-screen{--soft1:#eaf8ee;--soft2:#d6f1de;--sumink:#0b3d1e;--sumln:#9bd8ae}
        @media (prefers-color-scheme:dark){#app-screen{--soft1:#1b2e22;--soft2:#22392a;--sumink:#d8f0df;--sumln:#3c6b4a}}
        #app-screen nav{display:none}
        #app-screen .dline{height:5px;border-radius:5px;background:linear-gradient(90deg,#34d399,#16a34a,#0b5d2a);margin:4px 40px 14px 2px;position:relative}
        #app-screen .dleaf{position:absolute;right:-34px;top:-16px;font-size:1.5rem}
        #app-screen .sumbar{display:flex;align-items:stretch;border-radius:28px;padding:10px 6px;margin-bottom:14px;background:linear-gradient(135deg,var(--soft1),var(--soft2));border:1.5px solid var(--sumln);box-shadow:0 3px 12px rgba(22,101,52,.12)}
        #app-screen button.sumc{flex:1;display:flex;align-items:center;gap:10px;padding:6px 8px;min-width:0;background:none;border:0;border-radius:0;text-align:left;color:var(--sumink)}
        #app-screen button.sumc+button.sumc{border-left:1px solid var(--sumln)}
        #app-screen .sumi{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex:none}
        #app-screen .sumt{display:block;min-width:0}
        #app-screen .sumt small{display:block;font-size:.95rem;color:var(--mu);line-height:1.3}
        #app-screen .sumt b{display:block;font-size:1.45rem;line-height:1.25;font-weight:700;white-space:nowrap}
#app-screen .sumt b.lg{font-size:1.05rem}
        @media(max-width:520px){#app-screen button.sumc{flex-direction:column;text-align:center;gap:4px;padding:6px 2px}#app-screen .sumbar{border-radius:22px}#app-screen .sumt b{font-size:1.05rem}#app-screen .sumt small{font-size:.88rem}#app-screen .sumi{width:40px;height:40px;font-size:1.4rem}}
        #app-screen .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
        @media(min-width:640px){#app-screen .tiles{grid-template-columns:repeat(4,1fr)}}
        #app-screen button.tile{position:relative;display:block;text-align:left;padding:12px 12px 44px;min-height:132px;border-radius:16px;border:1px solid var(--ln);background:linear-gradient(160deg,var(--sf),rgba(45,106,62,.08))}
        #app-screen .tile .ti{position:relative;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6fdf8,#cdeed7);display:flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:6px}
        #app-screen .tile .tb{position:absolute;right:-3px;bottom:-3px;width:24px;height:24px;border-radius:50%;background:#16a34a;color:#fff;font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
        #app-screen .tile .tl{position:absolute;left:12px;bottom:10px;right:48px;font-weight:700;font-size:1.1rem;line-height:1.3}
        #app-screen .tc,#app-screen .tc2{width:30px;height:30px;border-radius:50%;background:rgba(45,106,62,.15);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem;flex:none}
        #app-screen .tile .tc{position:absolute;right:10px;bottom:10px}
        #app-screen .bigcards{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px}
        @media(min-width:640px){#app-screen .bigcards{grid-template-columns:1fr 1fr}}
        #app-screen button.bcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:16px;border:1px solid var(--ln);background:linear-gradient(160deg,var(--sf),rgba(45,106,62,.08))}
        #app-screen .bcard .bi{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6fdf8,#cdeed7);display:flex;align-items:center;justify-content:center;font-size:2.2rem;flex:none}
        #app-screen .bcard .ring{flex:none;display:block;width:64px;height:64px}
        #app-screen .bcard .bt{flex:1;min-width:0;display:block}
        #app-screen .bcard .bt b{display:block;font-size:1.2rem}
        #app-screen .bcard .bt small{display:block;color:var(--mu);font-size:.98rem;line-height:1.4}
        #app-screen .bcard .pill{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:12px;background:rgba(45,106,62,.14);font-size:.95rem;font-weight:600}
        #app-screen button.tkban{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;border-radius:14px;border:0;background:linear-gradient(135deg,#1d4ed8,#4338ca);color:#fff;margin-bottom:12px}
        #app-screen button.tkban b{display:block}
        #app-screen button.tkban small{display:block;opacity:.92;font-size:.92rem}
        /* ক্যালকুলেটর */
        #app-screen .cexp{min-height:1.6em;text-align:right;color:var(--mu)}
        #app-screen .cdisp{text-align:right;font-size:2.2rem;font-weight:700;word-break:break-all;margin-bottom:10px;min-height:1.4em}
        #app-screen .ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
        #app-screen button.ck{padding:14px 0;font-size:1.4rem;font-weight:600}
        #app-screen button.ck.op{background:rgba(45,106,62,.14);color:var(--ac)}
        #app-screen button.ck.eq{background:var(--ac);color:var(--ai);border-color:var(--ac)}
        #app-screen button.ck.z{grid-column:span 2}

        /* ===== আইকন ও প্রোগ্রেস পেজ ===== */
        #app-screen .ic{width:1em;height:1em;display:block}
        #app-screen .sumi svg{width:26px;height:26px;color:#157a3c}
        #app-screen .tile .ti svg{width:32px;height:32px;color:#157a3c}
        #app-screen .tile .tb svg{width:13px;height:13px;color:#fff}
        #app-screen .tc svg,#app-screen .tc2 svg{width:15px;height:15px}
        #app-screen .bcard .bi svg{width:36px;height:36px;color:#157a3c}
        #app-screen .pill svg{display:inline-block;width:14px;height:14px;vertical-align:-2px;color:#157a3c}
        #app-screen .dleaf svg{width:26px;height:26px;color:#16a34a}
        #app-screen .tkban .tki svg{width:24px;height:24px}
        #app-screen .avatar .avhen{width:28px;height:28px;color:#157a3c}
        #app-screen .avatar.big .avhen{width:56px;height:56px}
        #app-screen button.logout svg{width:18px;height:18px}
        #app-screen .foot{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center;margin-top:6px;padding:12px;border-radius:14px;background:linear-gradient(135deg,var(--soft1),var(--soft2));border:1px solid var(--sumln);color:var(--sumink);font-weight:600;font-size:.95rem}
        #app-screen .foot svg{width:22px;height:22px;color:#16a34a}
        #app-screen .foot svg.flip{transform:scaleX(-1)}
        #app-screen .foot i{width:1px;height:18px;background:var(--sumln)}
        #app-screen .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
        #app-screen .ph .phr{flex:none;width:46px;height:46px}
        #app-screen .ph .pht{flex:1;min-width:130px}
        #app-screen .ph .pht b{display:block;font-size:1.45rem;line-height:1.2}
        #app-screen .ph .pht small{display:block;color:var(--mu);font-size:.92rem;line-height:1.3}
        #app-screen .seg2{display:flex;background:rgba(45,106,62,.12);border-radius:10px;padding:3px;gap:2px}
        #app-screen .seg2 button{border:0;background:none;padding:7px 13px;border-radius:8px;font-size:1rem;color:var(--mu)}
        #app-screen .seg2 button.on{background:#1f7a3e;color:#fff}
        #app-screen .pc{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:12px}
        #app-screen .pc h2{margin-bottom:6px}
        #app-screen .drow{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:9px 12px;margin-bottom:12px}
        #app-screen .drow .dri svg{width:22px;height:22px;color:#1f7a3e}
        #app-screen .drow .drl{flex:1;font-weight:700;font-size:1.1rem}
        #app-screen .drow .drn{display:flex;gap:6px}
        #app-screen .drow .drn button{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
        #app-screen .drow .drn button svg{width:16px;height:16px}
        #app-screen .drow .drn button:disabled{opacity:.35;cursor:default}
        #app-screen .egc{display:flex;align-items:center;gap:12px}
        #app-screen .egc .egr{flex:none;width:98px;height:98px}
        #app-screen .egc .egt{flex:1;min-width:0}
        #app-screen .egc .egt small{display:block;color:var(--mu);font-size:1rem}
        #app-screen .egc .egt b{display:block;font-size:1.9rem;line-height:1.2}
        #app-screen .egc .egt em{display:block;font-style:normal;color:var(--mu);font-size:.98rem}
        #app-screen .egc .egp{flex:none;width:72px;height:72px;border-radius:50%;background:rgba(45,106,62,.14);display:flex;flex-direction:column;align-items:center;justify-content:center}
        #app-screen .egc .egp b{font-size:1.15rem;line-height:1.1}
        #app-screen .egc .egp small{font-size:.8rem;color:var(--mu)}
        #app-screen .stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
        #app-screen .stat4 .st{background:linear-gradient(160deg,var(--sf),rgba(45,106,62,.08));border:1px solid var(--ln);border-radius:14px;padding:10px 4px;text-align:center}
        #app-screen .st svg{width:26px;height:26px;color:#1f7a3e;margin:0 auto 4px}
        #app-screen .st.red svg{color:#d6453a}
        #app-screen .st small{display:block;font-size:.82rem;color:var(--mu);line-height:1.25;min-height:2.5em}
        #app-screen .st b{display:block;font-size:1rem;line-height:1.3}
        #app-screen .chartc svg{display:block;width:100%;height:auto}
        #app-screen .donutc{display:flex;align-items:center;gap:12px}
        #app-screen .donutc>svg{flex:none}
        #app-screen .lg{display:flex;align-items:center;gap:8px;padding:6px 0}
        #app-screen .lg i{width:11px;height:11px;border-radius:50%;flex:none}
        #app-screen .lg span{flex:1}
        #app-screen .lg b{white-space:nowrap}
        #app-screen .sr{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}
        #app-screen .sr .sri svg{width:22px;height:22px;color:#1f7a3e}
        #app-screen .sr span:nth-child(2){flex:1}

        /* ===== ছবির আইকন (ফটো থেকে নেওয়া) ===== */
        #app-screen .pic{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
        #app-screen .sumi,#app-screen .tile .ti,#app-screen .bcard .bi{background:none}
        #app-screen .sumi{width:58px;height:58px}
        #app-screen .tile .ti{width:84px;height:84px}
        #app-screen .bcard .bi{width:78px;height:78px}

        /* ===== সহজ ও ছোট ড্যাশবোর্ড ===== */
        #app-screen .tiles{grid-template-columns:repeat(3,1fr);gap:8px}
        @media(min-width:640px){#app-screen .tiles{grid-template-columns:repeat(5,1fr)}}

        #app-screen .tile .ti{width:46px;height:46px;margin:0 0 4px}
        #app-screen .tile .tl{position:static;display:block;font-size:.88rem;line-height:1.25;font-weight:600;max-width:100%;word-break:break-word}
        #app-screen .tile .tc{display:none}
        #app-screen .hencost{display:flex;align-items:center;justify-content:center;gap:8px;margin:-6px 0 12px;padding:7px 12px;border-radius:14px;background:var(--sf);border:1px dashed var(--sumln);font-size:.98rem;color:var(--sumink)}
        #app-screen .hencost b{font-size:1.15rem;color:var(--ac)}
        #app-screen button.back{display:inline-flex;align-items:center;gap:8px;background:var(--ac);color:var(--ai);border:0;padding:9px 18px;border-radius:24px;font-weight:700;font-size:1.05rem;box-shadow:0 3px 10px rgba(23,64,42,.35);margin-bottom:12px}
        #app-screen button.back svg{width:20px;height:20px;color:inherit}
        #app-screen .htot{margin:6px 0 10px;padding:10px 12px;border-radius:10px;background:var(--soft1);border:1px solid var(--sumln);font-weight:700;font-size:1.15rem;color:var(--sumink)}
        #app-screen .payrow{display:inline-flex;align-items:center;gap:4px}
        #app-screen input.payin{width:92px;margin:0;padding:5px 8px}

        #app-screen .setrow button{flex:1;padding:10px}

<style id="farm-select-style">

  #farm-select .fs-login { text-align: center; margin-top: 18vh; color: #1f5c3a; }
  #farm-select .fs-login h2 { margin: 0 0 16px; font-size: 1.35em; }
  #farm-select .fs-btn {
    background: #1f7a43; color: #fff; border: 0; border-radius: 999px;
    padding: 12px 28px; font: inherit; font-size: 1.05em; cursor: pointer;
  }

  #farm-select .fs-stage { position: relative; width: 100%; max-width: 900px; }
  #farm-select .fs-stage img { display: block; width: 100%; height: auto; border-radius: 14px; user-select: none; -webkit-user-drag: none; }
  #farm-select .hot {
    position: absolute; background: transparent; border: 0; padding: 0; margin: 0;
    border-radius: 14px; cursor: pointer;
  }
  #farm-select .hot:hover { background: rgba(31, 122, 67, .06); box-shadow: inset 0 0 0 3px rgba(31,122,67,.35); }
  #farm-select .hot:focus-visible { outline: 3px solid #2e7d4f; outline-offset: 2px; }
  #farm-select .fs-toast {

    background: #1d2a22; color: #fff; padding: 12px 22px; border-radius: 12px; display: none;
    font-family: "Noto Sans Bengali", system-ui, sans-serif;
  }
  #farm-select .fs-toast.show { display: block; }
</style>

        /* ফোনে শেষ লগইনের ভূমিকা মনে রাখা (অফলাইনে খোলার জন্য) */

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                unsubs.forEach(u => u());
                unsubs = [];
                stopFarmListeners();

            const cs = loadSession();

                BASE = cs.BASE || [];

            const email = (user.email || "").toLowerCase();

                const phone = email.replace(STAFF_DOMAIN, "");
                let name = "স্টাফ", ok = false, ownerUid = "";

                    const s = await withTO(getDoc(doc(db, "staff", phone)));

                    else {
                        const t = await withTO(getDoc(doc(db, "tstaff", phone)));

                    }
                } catch (_) {}
                if (!ok) {
                    showToast("এই নম্বরটি স্টাফ তালিকায় নেই। মালিকের সাথে যোগাযোগ করুন।", "error");
                    await signOut(auth);
                    return;
                }
                BASE = ownerUid ? ["users", ownerUid] : [];
                showToast(`স্বাগতম, ${name}!`);
                setupDashboard("staff", name, phone);
            } else if (await checkIsOwner(email)) {
                BASE = [];
                showToast("মালিক হিসেবে সফলভাবে লগইন হয়েছে!");
                setupDashboard("owner", user.displayName || "মালিক", email);
            } else if (await (async () => { try { const p = await withTO(getDoc(doc(db, "partners", email))); if (p.exists() && p.data().ownerUid && p.data().ownerUid !== user.uid) { PARTNER_OF = p.data().ownerUid; return true; } } catch (_) {} return false; })()) {
                BASE = ["users", PARTNER_OF];
                showToast("পার্টনার মালিক হিসেবে লগইন হয়েছে!");
                setupDashboard("owner", user.displayName || "পার্টনার", email);
            } else {
                BASE = ["users", user.uid];
                showToast("স্বাগতম! আপনার নিজস্ব খামারের হিসাব শুরু করুন।");
                setupDashboard("owner", user.displayName || "খামারি", email);
            }
        });

        window.logout = function () {
            signOut(auth).finally(() => location.reload());
        };

        /* ================= অ্যাপের অবস্থা ================= */

        const ME = { role: null, name: '', base: '', id: '', uid: '' };
        let PROF = null;
        let TASKS = [], PENDING = [], taskErrShown = false, lastSynced = '';
        let CALC = '', CEXP = '', CDONE = false;
        const isOwner = () => ME.role === 'owner';
        const farmUid = () => BASE.length ? BASE[1] : ME.uid;
        const KEYCUR = 'farm-hisab-cur';
        let PROG = 'week', PM = null, PY = null, PWO = 0;
        let PARTNER_OF = '';
        let FARMS = [], CUR = null, tab = 'dash', YM = null, aiText = '', seeding = false;
        let RAW = { batches: [], feeds: [], buys: [], logs: [], fin: [], chat: [] };
        let TEAM = { owners: [], staff: [] };
        let farmUnsubs = [], farmsUnsub = null, F = null, lastNav = '', lastFarmSel = '';

        const avatarInner = (nm) => (PROF && PROF.photo) ? '<img src="' + esc(PROF.photo) + '" alt="">' : ic('hen', 'avhen');
        function updateHeader() {
            const nm = (PROF && PROF.name) || ME.base || 'ব্যবহারকারী';
            ME.name = nm;
            $('user-name').textContent = nm;
            $('user-role-badge').textContent = isOwner() ? 'মালিক' : 'স্টাফ / কর্মী';
            $('avatar').innerHTML = avatarInner(nm);
            if (isOwner() && !BASE.length && ME.id && lastSynced !== nm) {
                lastSynced = nm;
                setDoc(doc(db, 'owners', ME.id), { name: nm }, { merge: true }).catch(() => {});
            }
        }
        function resizeImage(file, max = 256) {
            return new Promise((res, rej) => {
                const img = new Image(), url = URL.createObjectURL(file);
                img.onload = () => {
                    const sd = Math.min(img.width, img.height), c = document.createElement('canvas');
                    c.width = c.height = max;
                    const x = c.getContext('2d');
                    x.fillStyle = '#fff'; x.fillRect(0, 0, max, max);
                    x.drawImage(img, (img.width - sd) / 2, (img.height - sd) / 2, sd, sd, 0, 0, max, max);
                    URL.revokeObjectURL(url);
                    res(c.toDataURL('image/jpeg', 0.82));
                };
                img.onerror = () => rej(new Error('ছবিটি পড়া যায়নি'));
                img.src = url;
            });
        }

        function stopFarmListeners() {
            farmUnsubs.forEach(u => u()); farmUnsubs = [];
            if (farmsUnsub) { farmsUnsub(); farmsUnsub = null; }
        }

        function setupDashboard(role, name, id) {
            try { saveSession({ uid: auth.currentUser ? auth.currentUser.uid : '', role, name, id, BASE, partnerOf: (typeof PARTNER_OF !== 'undefined' ? PARTNER_OF : null) }); } catch (e) {}
            return setupDashboardReal(role, name, id);
        }
        function setupDashboardReal(role, name, identifier) {
            ME.role = role; ME.name = name; ME.id = identifier; ME.uid = auth.currentUser.uid;
            document.getElementById('login-screen').classList.add('hidden');

            ME.base = name; PROF = null; updateHeader();
            unsubs.push(onSnapshot(doc(db, 'profiles', ME.uid), (snap) => {
                PROF = snap.exists() ? snap.data() : null;

            }, () => {}));
            document.getElementById('rn').style.display = isOwner() ? '' : 'none';
            document.getElementById('nf').style.display = isOwner() ? '' : 'none';
            TASKS = []; PENDING = [];
            const tq = isOwner() ? colx('tasks') : query(colx('tasks'), where('toKey', '==', ME.id));
            unsubs.push(onSnapshot(tq, (snap) => {
                TASKS = snap.docs.map(d => ({ id: d.id, ...d.data() }));

            }, (err) => { if (!taskErrShown) { taskErrShown = true; showToast("কাজের তালিকা লোড সমস্যা: " + err.message, "error"); } }));

                window._remT = setInterval(checkReminders, 15000);
                document.addEventListener('visibilitychange', () => { if (!document.hidden) checkReminders(); });
            }
            tab = 'dash'; YM = null; aiText = '';
            stopFarmListeners();
            listenFarms();
        }

        /* ================= ছোট সাহায্যকারী ফাংশন ================= */

        const $ = (i) => document.getElementById(i);
        const bn = (n) => { try { return Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 }); } catch (e) { return String(n); } };
        /* "৩০.২০" = ৩০ পাতা ২০টি ডিম, "৩০" = ৩০ পাতা (ফুল), ডিমের অংশ ০-২৯ */
        function parseTrayInput(s) {
            const t = String(s || '').replace(/[০-৯]/g, c => '০১২৩৪৫৬৭৮৯'.indexOf(c)).trim();
            if (!t) return 0;
            const m = /^(\d+)(?:\.(\d{1,2}))?$/.exec(t);
            if (!m) return null;
            const trays = +m[1], rem = m[2] ? +m[2] : 0;
            if (rem > 29) return null;
            return trays * 30 + rem;
        }
        const shortN = (n) => {
            const v = Number(n) || 0, a = Math.abs(v), sg = v < 0 ? '-' : '';
            const f = (x, u) => sg + String(Number(x.toFixed(1))) + u;
            if (a >= 1e12) return f(a / 1e12, 'T');
            if (a >= 1e9) return f(a / 1e9, 'B');
            if (a >= 1e6) return f(a / 1e6, 'M');
            if (a >= 1e3) return f(a / 1e3, 'K');
            return sg + String(Math.round(a * 100) / 100);
        };
        const tk = (n) => '৳ ' + shortN(Math.round((Number(n) || 0) * 100) / 100);
        const rv = (x) => (x === '' || x == null) ? '' : Math.round(x * 100) / 100;
        const td = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
        const dAgo = (n) => { const d = new Date(Date.now() - n * 864e5); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
        const dt = (d) => String(d).split('-').reverse().join('/');
        const tsStr = (ts) => { const d = new Date(ts); return dt(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
        const sm = (a, fn) => a.reduce((s, x) => s + (+fn(x) || 0), 0);
        const tray = (n) => { n = Math.round(n); const t = Math.trunc(n / 30), p = Math.abs(n % 30); return shortN(t) + ' পাতা' + (p ? ' ' + bn(p) + 'টি' : ''); };
        const fc = (x) => x.bags * x.rate;
        const amt = (s) => s.qty * 30 * s.rate;
        const age = (b) => Math.max(0, Math.floor((Date.now() - new Date(b.date)) / 864e5));
        const ofb = (a, b) => a.filter(x => x.b === b.id);
        const hamt = (s) => s.qty * s.rate;
        const live = (f, b) => b.count - sm(ofb(f.logs, b), l => l.dead) - sm((f.hsold || []).filter(x => x.b === b.id), x => x.qty);
        const buyCost = (f) => sm(f.buys, x => (+x.bags || 0) * (+x.rate || 0));
        const feedShare = (f, b) => { const tot = sm(f.batches.filter(x => live(f, x) > 0), x => live(f, x)); return tot > 0 && live(f, b) > 0 ? buyCost(f) * live(f, b) / tot : 0; };
        const bcost = (f, b) => (+b.cost || 0) + feedShare(f, b) + sm(ofb(f.meds, b), m => m.v);
        const feedStock = (f) => sm(f.buys, x => x.bags) - sm(f.feeds, x => x.bags);
        const eggStock = (f) => sm(f.logs, l => l.eggs) - sm(f.sales, s => s.qty * 30);
        const last = (a, k) => a.length ? a[a.length - 1][k] : '';
        const lastRate = (f) => rv(last(f.buys, 'rate') || last(f.feeds, 'rate') || '');
        const srt = (a) => a.slice().sort((x, y) => y.d.localeCompare(x.d) || (y.ts || 0) - (x.ts || 0));
        const bopts = (bs) => bs.map(b => '<option value="' + esc(b.id) + '">' + esc(b.name) + '</option>').join('');
        const bname = (f, id) => { const b = f.batches.find(x => x.id === id); return b ? esc(b.name) : ''; };
        const val = (i) => $(i).value;
        const num = (i) => parseFloat(String($(i).value).replace(/[০-৯]/g, c => '০১২৩৪৫৬৭৮৯'.indexOf(c)).replace(/[,৳\s]/g, '')) || 0;
        const canDel = (x) => isOwner() || x.uid === ME.uid;
        const R = (l, m, r, a, i, can) => '<div class="row"><div>' + l + '<div class="mu">' + m + '</div></div><div><b>' + r + '</b>' + (can ? '<button class="s d" data-a="' + a + '" data-i="' + esc(i) + '">মুছুন</button>' : '') + '</div></div>';
        const nob = () => '<section class="mu">আগে ড্যাশবোর্ডে একটি ব্যাচ যোগ করুন।</section>';
        const onlyOwner = () => '<section class="mu">এই অংশ শুধু মালিকদের জন্য।</section>';

        function rep(f, ym) {
            const m = (a) => a.filter(x => String(x.d).slice(0, 7) === ym);
            const Sl = m(f.sales), feed = sm(m(f.feeds), fc), med = sm(m(f.meds), x => x.v), nt = sm(m(f.notes), x => x.v),
                ep = sm(m(f.logs), l => l.eggs), Hs = m(f.hsales || []), inc = sm(Sl, amt) + sm(Hs, hamt);
            return { feed, med, nt, ep, es: sm(Sl, s => s.qty * 30), inc, due: sm(Sl, s => amt(s) - s.paid) + sm(Hs, s => hamt(s) - s.paid), cost: feed + med + nt, net: inc - feed - med - nt };
        }

        /* ================= ডাটাবেজ (Firestore) ================= */

        const fcol = (k) => colx('farms', CUR, k);
        const newId = (k) => doc(fcol(k)).id;
        const stamp = () => ({ ts: Date.now(), by: ME.name, uid: ME.uid });

        function listenFarms() {
            farmsUnsub = onSnapshot(colx('farms'), async (snap) => {
                FARMS = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.ts || 0) - (b.ts || 0));
                if (!FARMS.length && isOwner() && !seeding) {
                    seeding = true;
                    try { await setDoc(docx('farms', 'farm-1'), { name: 'খামার ১', ts: Date.now() }); } catch (e) { showToast("খামার তৈরি সমস্যা: " + e.message, "error"); }
                    return;
                }
                if (!FARMS.find(x => x.id === CUR)) {
                    const saved = localStorage.getItem(KEYCUR);
                    CUR = (FARMS.find(x => x.id === saved) || FARMS[0] || {}).id || null;
                    attachFarm();
                }
                render(true);
            }, (err) => showToast("ডাটা লোড সমস্যা: " + err.message, "error"));
        }

        function attachFarm() {
            farmUnsubs.forEach(u => u()); farmUnsubs = [];
            RAW = { batches: [], feeds: [], buys: [], logs: [], fin: [], chat: [] };
            if (!CUR) return;
            try { localStorage.setItem(KEYCUR, CUR); } catch (e) {}
            const keys = ['batches', 'feeds', 'buys', 'logs', 'hsold'];
            if (isOwner()) keys.push('fin');
            farmUnsubs.push(onSnapshot(query(fcol('assistant'), where('uid', '==', ME.uid)), (snap) => {
                RAW.chat = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.ts || 0) - (b.ts || 0));
                if (tab === 'ai') render(true);
            }, (err) => showToast("সহকারীর ডাটা লোড সমস্যা: " + err.message, "error")));
            keys.forEach(k => {
                farmUnsubs.push(onSnapshot(fcol(k), (snap) => {
                    RAW[k] = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.ts || 0) - (b.ts || 0));
                    render(true);
                }, (err) => showToast("ডাটা লোড সমস্যা: " + err.message, "error")));
            });
        }

        function build() {
            const fin = RAW.fin, bc = {}, fr = {}, br = {};
            fin.forEach(x => {
                if (x.t === 'bcost') bc[x.b] = +x.v || 0;
                else if (x.t === 'frate') fr[x.ref] = +x.rate || 0;
                else if (x.t === 'brate') br[x.ref] = +x.rate || 0;
            });
            const by = (t) => fin.filter(x => x.t === t);

        const WD = ['রবি', 'সোম', 'মঙ্গল', 'বুধ', 'বৃহ', 'শুক্র', 'শনি'];

        // ডিম দেওয়ার বয়সী (১২০+ দিন) মুরগির মধ্যে কত শতাংশ ডিম দিচ্ছে
        function layRate(f) {

        const shortMoney = (v) => v >= 1000 ? bn(Math.round(v / 100) / 10) + 'হা' : bn(Math.round(v));

        function barChart(title, labels, series) {
            const W = 340, H = 170, L = 6, Rr = 6, T = 16, B = 40, n = labels.length;
            const max = Math.max(1, ...series.flatMap(s => s.vals));
            const gw = (W - L - Rr) / n, bw = Math.min(22, (gw - 4) / series.length);
            let g = '';
            labels.forEach((lb, i) => {
                const cx = L + gw * i + gw / 2;
                series.forEach((s, j) => {
                    const v = s.vals[i], h = (H - T - B) * v / max, x = cx - bw * series.length / 2 + bw * j, y = H - B - h;
                    g += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (bw - 1).toFixed(1) + '" height="' + Math.max(h, v > 0 ? 1 : 0).toFixed(1) + '" rx="2" style="fill:' + s.color + '"/>';
                    if (n <= 7 && v > 0) g += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 3).toFixed(1) + '" text-anchor="middle" font-size="11" style="fill:var(--ink)">' + esc(s.short(v)) + '</text>';
                });
                String(lb).split('|').forEach((p, k) => {
                    g += '<text x="' + cx.toFixed(1) + '" y="' + (H - B + 14 + k * 13) + '" text-anchor="middle" font-size="' + (n > 7 ? 10 : 12) + '" style="fill:var(--mu)">' + esc(p) + '</text>';
                });
            });
            g += '<line x1="' + L + '" x2="' + (W - Rr) + '" y1="' + (H - B) + '" y2="' + (H - B) + '" style="stroke:var(--ln)"/>';
            const legend = series.map(s => '<span style="color:' + s.color + '">■</span> ' + esc(s.name)).join(' &nbsp; ');
            return '<div class="card"><b>' + esc(title) + '</b><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(title) + '">' + g + '</svg><div class="mu">' + legend + '</div></div>';

        /* ================= কাজ ও রিমাইন্ডার ================= */

        const en = (t) => String(t).replace(/[০-৯]/g, c => '০১২৩৪৫৬৭৮৯'.indexOf(c)).normalize('NFC');

        const fmt12 = (tm) => { const [h, m] = String(tm).split(':').map(Number); return periodWord(h) + ' ' + (h % 12 || 12) + ':' + String(m).padStart(2, '0'); };

        function people() {

        // --- সময় বোঝা ---
        const PER_RE = /(ভোর|সকাল|দুপুর|বিকাল|বিকেল|সন্ধ্যা|রাত)(?:ে|য\u09BC)?(?![\u0980-\u09FF])/g;
        function to24(h, per) {
            if (h > 12) return h;
            if (per === 'ভোর' || per === 'সকাল') return h === 12 ? 0 : h;
            if (per === 'দুপুর') return h === 12 ? 12 : (h <= 4 ? h + 12 : h);
            if (per === 'বিকাল' || per === 'বিকেল' || per === 'সন্ধ্যা') return h < 12 ? h + 12 : h;
            if (per === 'রাত') return h === 12 ? 0 : (h >= 6 ? h + 12 : h);
            if (h >= 1 && h <= 4) return h + 12;

        }
        function countTimes(seg) {
            return (seg.match(/\d{1,2}\s*টা|\d{1,2}[:.]\d{2}|(?:সাড়ে|সোয়া|পৌনে)\s*\d/g) || []).length;
        }
        function parseTime(seg) {
            let core = null, m, perInside = null;
            if ((m = /(সাড়ে|সোয়া|পৌনে)\s*(\d{1,2})(?:\s*টা(?:য\u09BC|র)?)?/.exec(seg))) {
                let h = +m[2]; const mi = m[1] === 'সাড়ে' ? 30 : m[1] === 'সোয়া' ? 15 : 45;
                if (m[1] === 'পৌনে') h -= 1;
                core = { h, mi, i: m.index, len: m[0].length };
            } else if ((m = /(\d{1,2})[:.](\d{2})/.exec(seg))) {
                core = { h: +m[1], mi: +m[2], i: m.index, len: m[0].length };
            } else if ((m = /(\d{1,2})\s*(?:টা(?:য\u09BC|র)?|ঘটিকা)(?:\s*(\d{1,2})\s*মিনিট(?:ে)?)?/.exec(seg))) {
                core = { h: +m[1], mi: m[2] ? +m[2] : 0, i: m.index, len: m[0].length };
            } else {
                const r = /(ভোর|সকাল|দুপুর|বিকাল|বিকেল|সন্ধ্যা|রাত)(?:ে|য\u09BC)?\s*(\d{1,2})(?![\d\u0980-\u09FF])/.exec(seg);
                if (r) { core = { h: +r[2], mi: 0, i: r.index, len: r[0].length }; perInside = r[1]; }
            }
            if (!core || core.h > 24 || core.mi > 59) return null;
            const ranges = [[core.i, core.i + core.len]];
            let per = perInside;
            if (!per) {
                let best = null; PER_RE.lastIndex = 0;
                let p;
                while ((p = PER_RE.exec(seg))) {
                    const dist = Math.min(Math.abs(p.index - core.i), Math.abs(p.index - (core.i + core.len)));
                    if (dist <= 15 && (!best || dist < best.dist)) best = { dist, per: p[1], i: p.index, len: p[0].length };
                }
                if (best) { per = best.per; ranges.push([best.i, best.i + best.len]); }
            }
            const h24 = to24(core.h, per);
            return { time: String(h24 % 24).padStart(2, '0') + ':' + String(core.mi).padStart(2, '0'), per, h12: core.h, ranges };
        }
        function removeRanges(str, ranges) {
            let out = str;
            ranges.slice().sort((a, b) => b[0] - a[0]).forEach(r => { out = out.slice(0, r[0]) + ' ' + out.slice(r[1]); });
            return out;
        }

        // --- তারিখ বোঝা ---
        const W_DAILY = ['প্রতিদিন', 'রোজ', 'দৈনিক', 'প্রত্যহ', 'প্রতিদিনই'], W_TOM = ['কাল', 'কালকে', 'আগামীকাল', 'আগামিকাল'], W_DAT = ['পরশু', 'পরশুদিন'], W_TOD = ['আজ', 'আজকে'];
        const W_ALLDATE = W_DAILY.concat(W_TOM, W_DAT, W_TOD, ['তারিখ']);
        function parseDate(seg) {
            const words = seg.split(/[\s,;:!?।()]+/).filter(Boolean);
            if (words.some(w => W_DAILY.includes(w)) || /প্রত্যেক\s*দিন/.test(seg)) return { daily: true };
            const dm = /(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/.exec(seg);
            if (dm) {
                const y = dm[3] ? (dm[3].length === 2 ? 2000 + +dm[3] : +dm[3]) : new Date().getFullYear();
                return { date: y + '-' + String(+dm[2]).padStart(2, '0') + '-' + String(+dm[1]).padStart(2, '0'), range: [dm.index, dm.index + dm[0].length] };
            }
            if (words.some(w => W_DAT.includes(w))) return { date: dAgo(-2) };
            if (words.some(w => W_TOM.includes(w))) return { date: dAgo(-1) };

        // --- নাম বোঝা ---
        const SUF = ['', 'কে', 'র', 'ের', 'এর', 'ও', 'ই', 'রা', 'দের', 'কেও', 'ে'];
        const NSTOP = ['মোঃ', 'মো', 'মো.', 'মোহাম্মদ', 'মুহাম্মদ', 'মোহাম্মাদ', 'মোছাঃ', 'মোসাঃ', 'আব্দুল', 'মিস', 'মিঃ'];
        const wm = (w, t) => w.startsWith(t) && SUF.includes(w.slice(t.length));
        const nameTokens = (p) => String(p.name || '').normalize('NFC').split(/\s+/).filter(t => t.length >= 2 && !NSTOP.includes(t));
        function findPeople(seg) {
            const words = seg.split(/[\s,;:!?।()]+/).filter(Boolean), ps = people();
            const hit = new Map(), amb = [];
            words.forEach(w => {
                const c = ps.filter(p => nameTokens(p).some(t => wm(w, t)));
                if (c.length === 1) hit.set(c[0].key, c[0]);
                else if (c.length > 1) amb.push(c);
            });
            let ambig = null;
            amb.forEach(c => { if (!c.some(p => hit.has(p.key)) && !ambig) ambig = c; });
            let found = [...hit.values()];
            if (!found.length && !ambig && words.some(w => ['আমি', 'আমার', 'আমাকে', 'আমিই'].includes(w))) {
                const me = ps.find(p => p.key === ME.id); if (me) found = [me];

        function parseTasks(text) {
            const norm = en(text), items = [];
            norm.split(/[\n।;]+/).map(x => x.trim()).filter(Boolean).forEach(seg => {
                const parts = countTimes(seg) > 1 ? seg.split(/\s*,\s*|\s+এবং\s+|\s+আর\s+/).map(x => x.trim()).filter(Boolean) : [seg];
                let lastP = null, lastD = null;

        // --- নোটিফিকেশন ---

        /* ================= ট্যাব ও পেজ ================= */

        const OWNER_TABS = [['dash', 'ড্যাশবোর্ড'], ['chick', 'বাচ্চার খরচ'], ['feed', 'খাবার'], ['med', 'ওষুধ'], ['egg', 'ডিম ও মৃত্যু'], ['sale', 'ডিম বিক্রি'], ['note', 'খরচের খাতা'], ['buy', 'ক্রেতা'], ['rep', 'রিপোর্ট'], ['team', 'মালিক ও স্টাফ']];

            const now = td();
            return { label: 'শুরু থেকে আজ পর্যন্ত', pred: d => d <= now, days: [] };
        }
        function monthFromText(q) {
            const t = en(q), now = new Date();
            const m = new RegExp('(?<![\\u0980-\\u09FF])(' + MONTH_RE + ')(?![\\u0980-\\u09FF])(?:\\s*(\\d{4}))?').exec(t);
            if (!m) return null;
            const mo = BN_MONTHS[m[1]];
            let y = m[2] ? +m[2] : now.getFullYear();
            if (!m[2] && mo > now.getMonth() + 1) y -= 1;
            const ym = y + '-' + pad2(mo);
            return { label: MONTH_BN[mo] + ' ' + bn(y) + ' মাসের', pred: d => String(d).slice(0, 7) === ym, days: monthDays(ym) };
        }

        function answer(q) {
            const f = F, own = isOwner();
            if (!f) return 'খামারের তথ্য এখনো লোড হয়নি।';
            const now = td(), ym = now.slice(0, 7);
            const T = agg(f, d => d === now), M = agg(f, d => d.slice(0, 7) === ym);
            if (/কাজ|দায়িত্ব|রিমাইন্ডার|মনে করিয়ে/.test(q)) {
                const byT = (a, b) => a.time.localeCompare(b.time);
                const mine = TASKS.filter(t => t.toKey === ME.id && occursOn(t, now)).sort(byT);
                let r = mine.length ? 'আজ আপনার কাজ:\n' + mine.map(t => '• ' + fmt12(t.time) + ' — ' + t.title + (t.lastDone === now ? ' (হয়েছে)' : '')).join('\n') : 'আজ আপনার কোনো কাজ নেই।';
                if (own) {
                    const others = TASKS.filter(t => t.toKey !== ME.id && occursOn(t, now)).sort(byT);
                    if (others.length) r += '\n\nঅন্যদের আজকের কাজ:\n' + others.map(t => '• ' + t.toName + ': ' + fmt12(t.time) + ' — ' + t.title + (t.lastDone === now ? ' (হয়েছে)' : '')).join('\n');
                }
                const mr = memoReminders(f, now);
                if (mr.length) r += '\n\nনোট থেকে আজকের রিমাইন্ডার:\n' + mr.map(t => '• ' + fmt12(t.time) + ' — ' + t.title).join('\n');
                return r;
            }
            const spec = dateFromText(q);
            const cum = cumulativeFromText(q);
            const per = /শতাংশ|পারসেন্ট|%|হার/.test(q) ? null : (cum || rangeFromText(q) || (spec ? { label: dt(spec) + ' তারিখের', pred: d => d === spec, days: [spec] } : (monthFromText(q) || periodOf(q))));
            if (per && /দিনে দিনে|প্রতিদিন|দিন দিন|দৈনিক|দিন ধরে/.test(q)) return dailyBreakdown(f, per, own);
            if (per && /হিসাব|খরচ|লাভ|লোকসান|আয়|বিক্রি|মুরগি|ডিম|মৃত্যু/.test(q)) return periodReport(f, per, own);
            if (own && /নোট/.test(q) && /লাভ|লোকসান|হিসাব/.test(q)) {
                const all = memoProfits(f, () => true);
                return all.length ? 'নোটে লেখা লাভ-লোকসানের হিসাব:\n' + all.map(x => '• ' + x.label + ': ' + tk(x.v)).join('\n') : 'নোটে কোনো লাভের হিসাব লেখা নেই।';
            }
            if (/নোট|লিখে রেখেছি|লিখা আছে|লেখা আছে/.test(q) && !/লাভ|লোকসান|হিসাব|খরচ/.test(q)) {
                const list = (f.memos || []).filter(x => !per || per.pred(x.d)).filter(x => String(x.text || '').trim()).slice(-10).reverse();
                if (!list.length) return (per ? per.label + ' ' : '') + 'নোট পেজে কোনো লেখা পাওয়া যায়নি।';
                return (per ? per.label + ' ' : 'সাম্প্রতিক ') + 'নোটসমূহ:\n' + list.map(x => '• [' + dt(x.d) + '] ' + String(x.text).trim()).join('\n');
            }
            if (/শতাংশ|পারসেন্ট|%|হার/.test(q)) {
                const l = layRate(f);
                if (!l) return 'ডিম দেওয়ার বয়সী (১২০ দিন) কোনো ব্যাচ এখনো নেই।';
                if (l.none) return 'ডিমের হিসাব এখনো লেখা হয়নি, তাই হার বের করা যাচ্ছে না।';
                return (l.d === now ? 'আজ' : dt(l.d) + ' তারিখে') + ' ডিম দেওয়ার বয়সী মুরগির প্রায় ' + bn(l.pct) + '% ডিম দিয়েছে।' + (l.rows.length > 1 ? '\n' + l.rows.map(r => r.name + ': ' + bn(r.pct) + '%').join('\n') : '');
            }
            if (/লাভ|লোকসান|আয়|বকেয়া/.test(q)) {
                if (!own) return 'এই তথ্য শুধু মালিক দেখতে পারেন।';
                const r = rep(f, ym);
                return 'এই মাসে: খরচ ' + tk(r.cost) + ', বিক্রয় আয় ' + tk(r.inc) + ', বকেয়া ' + tk(r.due) + '।\n' + (r.ep === 0 && r.inc === 0 ? 'ডিমের আয় নেই, তাই এটি চলতি উৎপাদন ব্যয়।' : 'প্রকৃত ' + (r.net >= 0 ? 'লাভ ' : 'লোকসান ') + tk(Math.abs(r.net)) + '।');
            }
            if (/খরচ|টাকা/.test(q)) {
                if (!own) return 'এই তথ্য শুধু মালিক দেখতে পারেন।';
                if (/মাস/.test(q)) return expenseReport(f, d => String(d).slice(0, 7) === ym, 'এ মাসে');
                return expenseReport(f, d => d === now, 'আজ');
            }
            if (/ডিম/.test(q)) return 'আজ ডিম হয়েছে ' + tray(T.eggs) + '।\nএ মাসে মোট ডিম ' + tray(M.eggs) + '।' + (own ? '\nমজুত আছে ' + tray(eggStock(f)) + '।' : '');
            if (/খাবার|বস্তা|ফিড/.test(q)) {
                const lv = sm(f.batches, b => live(f, b)), tc = sm(f.batches.filter(b => live(f, b) > 0), b => bcost(f, b));
                return 'খাবারে এ পর্যন্ত মোট খরচ (যা কেনা হয়েছে): ' + tk(buyCost(f)) + '।'
                    + (lv > 0 ? '\nমুরগির এ পর্যন্ত মোট খরচ: ' + tk(tc) + ', মাথাপিছু ' + tk(tc / lv) + ' (এখন মুরগি ' + bn(lv) + 'টি)।' : '');
            }
            if (/মুরগি|স্বাস্থ্য|মৃত্যু|মরে|মরা/.test(q)) {
                const hens = sm(f.batches, b => live(f, b)), a = dAgo(7), b0 = dAgo(14);
                const w = f.logs.filter(l => l.d > a), p = f.logs.filter(l => l.d > b0 && l.d <= a);
                const dead = sm(w, l => l.dead), e1 = sm(w, l => l.eggs), e0 = sm(p, l => l.eggs);
                let t = 'এখন মুরগি আছে ' + bn(hens) + 'টি। গত ৭ দিনে মরেছে ' + bn(dead) + 'টি' + (hens > 0 ? ' (প্রায় ' + bn(Math.round(dead / hens * 1000) / 10) + '%)' : '') + '।';
                if (e0 > 0) t += '\nগত ৭ দিনের ডিম তার আগের ৭ দিনের চেয়ে ' + (e1 >= e0 ? 'বেশি' : 'কম') + ' (' + tray(e1) + ' ও ' + tray(e0) + ')।';
                return t + '\nমৃত্যু হঠাৎ বাড়লে বা ডিম অনেক কমলে পশু চিকিৎসকের পরামর্শ নিন।';
            }
            if (per) return periodReport(f, per, own);
            if (q.length >= 3 && Array.isArray(f.memos)) {
                const hit = f.memos.filter(m => String(m.text || '').toLowerCase().includes(q.toLowerCase()));
                if (hit.length) return 'আপনার নোটে এই তথ্য পাওয়া গেছে:\n' + hit.slice(-5).map(m => '• [' + dt(m.d) + '] ' + m.text).join('\n');
            }
            return 'প্রশ্নটি বুঝতে পারিনি। ডিম, খরচ, খাবার, ডিম দেওয়ার হার বা মুরগির স্বাস্থ্য নিয়ে জিজ্ঞেস করুন।\nযেমন: "৫ নভেম্বর থেকে ১৫ নভেম্বর পর্যন্ত লাভ কত?", "পুরো অক্টোবর মাসে কত খরচ?", "১২ নভেম্বর কত টাকা খরচ হয়েছে?"';
        }

        /* ================= টিম (মালিক ও স্টাফ) ================= */

        async function loadTeam() {
            if (!isOwner()) return;
            try {
                let o = { docs: [] };
                try { o = BASE.length ? await getDocs(query(collection(db, 'partners'), where('ownerUid', '==', farmUid()))) : await getDocs(collection(db, 'owners')); } catch (e1) { if (tab === 'team') showToast('পার্টনার তালিকা পড়া যায়নি: Firebase Rules এ partners এর অনুমতি দিন।', 'error'); }
                TEAM.owners = o.docs.map(d => d.id).sort();
                TEAM.ownerList = o.docs.map(d => ({ email: d.id, name: d.data().name || '' }));
                if (BASE.length && ME.id && !TEAM.ownerList.some(x => x.email === ME.id)) { TEAM.ownerList.unshift({ email: ME.id, name: ME.name }); TEAM.owners.unshift(ME.id); }
                const s = BASE.length ? await getDocs(query(collection(db, 'tstaff'), where('ownerUid', '==', farmUid()))) : await getDocs(collection(db, 'staff'));
                TEAM.staff = s.docs.map(d => d.data()).sort((a, b) => String(a.name).localeCompare(String(b.name)));

                if (tab === 'team') showToast("তালিকা লোড সমস্যা: " + error.message, "error");
            }
        }

        /* মুরগি বিক্রয়: পিস/কেজি বদলানো ও অটো হিসাব */
        function hsaleCalc() {

            const kg = (document.getElementById('hm') || {}).value === 'kg';
            const total = kg ? g('hkq') * g('hkr') : g('hq') * g('hr');
            t.textContent = 'মোট টাকা: ' + tk(total);

  const selApp = initializeApp({

    authDomain: "poultry-farm-app-2b196.firebaseapp.com",
    projectId: "poultry-farm-app-2b196",
    storageBucket: "poultry-farm-app-2b196.firebasestorage.app",
    messagingSenderId: "332658852671",
    appId: "1:332658852671:web:a754a78c3b0b2b237d898a",
    measurementId: "G-YG8CFFQNDH"
  }, "farm-select");
  const selAuth = getAuth(selApp);

  const STAFF_DOMAIN = "@staff.poultryfarm.app";
  const overlay = document.getElementById("farm-select");
  const loginBox = document.getElementById("fs-login");
  const picker = document.getElementById("fs-picker");
  const toast = document.getElementById("fs-toast");

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 1800);
  }

  function showOverlay(mode) {
    overlay.hidden = false;
    loginBox.hidden = mode !== "login";
    picker.hidden = mode !== "picker";
  }

  document.getElementById("fs-gbtn").addEventListener("click", async () => {
    try { await signInWithPopup(selAuth, new GoogleAuthProvider()); }
    catch (e) { showToast("লগইন হয়নি, আবার চেষ্টা করুন"); }

  document.getElementById("fs-staff").addEventListener("click", () => { overlay.hidden = true; });

    const btn = ev.target.closest(".hot");
    if (!btn) return;

      overlay.hidden = true; // লেয়ার: মূল অ্যাপ এখন দেখাবে
    } else {

    showOverlay("picker");
  });
