<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ব্রয়লার মুরগির খামার</title>
<meta name="theme-color" content="#1f7a43">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --g1: #14532d; --g2: #1f7a43; --g3: #2e9d5a; --g4: #3fbf6a;
    --mint: #e8f6ec; --line: #cfe6d6; --ink: #1d2a22; --muted: #5b6b61;
    --bg: #eef9f1; --red: #b42318; --redbg: #fdecea; --gold: #f2b033;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
    background: linear-gradient(180deg, #e3f7e8 0%, var(--bg) 45%, #f7fcf8 100%);
    color: var(--ink); min-height: 100vh; line-height: 1.55;
  }
  [hidden] { display: none !important; }

  header.top {
    background: linear-gradient(90deg, #15673a, var(--g2) 60%, #23874d); color: #fff;
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 12px rgba(20, 83, 45, .28);
  }
  header.top h1 { font-size: 1.25em; margin: 0; font-weight: 700; }
  .back {
    background: rgba(255, 255, 255, .18); border: 0; color: #fff;
    width: 38px; height: 38px; border-radius: 50%; font-size: 1.3em; cursor: pointer; flex: none;
  }
  .back:focus-visible, .tile:focus-visible, .btn:focus-visible, .fin-strip:focus-visible { outline: 3px solid var(--g4); outline-offset: 2px; }
  main { max-width: 1000px; margin: 0 auto; padding: 14px; }

  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 18px;
    padding: 16px; box-shadow: 0 2px 10px rgba(20, 83, 45, .06);
  }
  .section { margin-top: 14px; }
  h2.sec { font-size: 1.1em; color: var(--g1); margin: 0 0 12px; font-weight: 700; }

  /* উপরের তিনটি ঘর */
  .hero {
    display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 0; padding: 0; overflow: hidden;
    background: linear-gradient(90deg, #d8f5e0, #f1fcf4 45%, #cdeed8);
  }
  .hero-sign {
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 14px 10px;
    background: linear-gradient(180deg, #ffd66b, #f2b033); color: #14532d; font-weight: 700;
    font-size: 1.15em; border-right: 4px solid #d9921d; margin: 10px 0 10px 10px; border-radius: 10px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), 0 3px 8px rgba(120, 80, 0, .18);
  }
  .hero-col { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8px 6px; }
  .hero-col img { height: 92px; width: auto; max-width: 100%; object-fit: contain; }
  .hero-col .hk { font-size: .9em; color: var(--muted); margin-top: 4px; }
  .hero-col .hv { font-size: 1.45em; font-weight: 700; color: var(--g1); line-height: 1.2; }

  /* মেনু কার্ড */
  .menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .menu.two { grid-template-columns: repeat(2, 1fr); }
  .menu.wide { grid-template-columns: 1fr 2fr; }
  .menu.one { grid-template-columns: 1fr; }
  .menu.three { grid-template-columns: repeat(3, 1fr); }
  .tile {
    display: flex; align-items: center; gap: 10px; min-width: 0; text-align: left; cursor: pointer;
    font: inherit; color: inherit; position: relative;
    background: linear-gradient(180deg, #ffffff, #f6fcf8); border: 2px solid var(--g4);
    border-radius: 20px; padding: 10px 12px; box-shadow: 0 2px 10px rgba(20, 83, 45, .07);
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .tile { height: 104px; }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(20, 83, 45, .14); }
  .tile:active, .tile.pressed {
    background: linear-gradient(135deg, var(--g3), var(--g1)); border-color: var(--g1); transform: scale(.98);
    box-shadow: 0 6px 16px rgba(20, 83, 45, .35);
  }
  .tile:active .t, .tile.pressed .t, .tile:active .s, .tile.pressed .s { color: #fff; }
  .tile .art { width: 68px; height: 68px; flex: none; display: flex; align-items: center; justify-content: center; }
  .tile .art img, .tile .art svg { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; }
  .tile .tx { min-width: 0; display: flex; flex-direction: column; }
  .tile .t { font-weight: 700; color: var(--g1); font-size: 1.1em; line-height: 1.25; }
  .tile .s { color: var(--muted); font-size: .9em; line-height: 1.3; }
  .tile .bar { height: 14px; background: #e2f2e6; border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .tile .bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--g4), var(--g2)); }
  .tile .pct {
    position: absolute; right: 12px; top: 10px; background: var(--g2); color: #fff; font-weight: 700;
    border-radius: 999px; padding: 3px 10px; font-size: .9em;
  }
  .tile.pt { flex-direction: row; }
  .tile.pt .tx { flex: 1; }
  .tile.pt .art { width: 68px; height: 68px; }
  .tile .pbox { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .tile .pbox .bar { margin-top: 6px; }

  /* নিচের আর্থিক সারসংক্ষেপ */
  .fin-strip { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); padding: 10px 6px; cursor: pointer; font: inherit; color: inherit; text-align: left; }
  .fin-strip.plain { cursor: default; }
  .fin-i { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 12px 8px; margin: 0 4px; border-radius: 16px; border-top: 4px solid; min-width: 0; }
  .fin-i small { font-size: .85em; font-weight: 600; }
  .fin-i b { font-size: 1.2em; }
  .fin-in { background: #e7f8ee; border-color: #2e9d5a; }
  .fin-in small { color: #166534; } .fin-in b { color: #14532d; }
  .fin-out { background: #fff3e4; border-color: #f29b2c; }
  .fin-out small { color: #9a4a06; } .fin-out b { color: #b45309; }
  .fin-pr { background: #e8f0ff; border-color: #2563eb; }
  .fin-pr small { color: #1e3a8a; } .fin-pr b { color: #1d4ed8; }
  .fin-pr b.neg { color: var(--red); }

  /* AI ব্যানার (পরে সরাতে চিহ্ন দেওয়া) */
  /* ===== AI-BANNER:START (পরে সরাতে এই CSS ও HTML ব্লক মুছে ফেলুন) ===== */
  .ai-banner { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 8px 16px 8px 8px;
    background: linear-gradient(90deg, #dff5e4, #f5fffa 60%, #d6f1e0); border-radius: 20px; }
  .ai-robot { height: 80px; width: auto; flex: none; object-fit: contain; }
  .ai-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ai-text b { color: var(--g1); font-size: 1.15em; }
  .ai-text span { color: var(--muted); font-size: .9em; }
  /* ===== AI-BANNER:END ===== */

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #1d2a22; color: #fff;
    padding: 11px 20px; border-radius: 12px; display: none; font-size: .95em; z-index: 50;
  }
  .toast.show { display: block; }

  /* ক্যালকুলেটর, নোট, প্রোগ্রেস, সারসংক্ষেপ */
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form .full { grid-column: 1 / -1; }
  label.f { font-size: .92em; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
  input, select, textarea {
    font: inherit; font-size: 1rem; color: var(--ink);
    padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fbfefc; width: 100%;
  }
  textarea { min-height: 90px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--g3); border-color: transparent; }
  .btn {
    background: linear-gradient(90deg, var(--g2), var(--g3)); color: #fff; border: 0; border-radius: 999px;
    padding: 12px 22px; font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(31, 122, 67, .3);
  }
  .btn.ghost { background: var(--mint); color: var(--g1); box-shadow: none; }

  .pill { position: relative; display: inline-block; }
  .pill input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .pill span { display: inline-block; padding: 9px 18px; border-radius: 999px; background: var(--mint); color: var(--g1); font-weight: 600; cursor: pointer; }
  .pill input:checked + span { background: var(--g2); color: #fff; }
  .pill input:focus-visible + span { outline: 3px solid var(--g3); outline-offset: 2px; }
  .pills { display: flex; gap: 10px; flex-wrap: wrap; }

  .preview { background: linear-gradient(90deg, #e8f6ec, #f7fff9); border: 1px dashed var(--g3); border-radius: 14px; padding: 12px 14px; }
  .preview .calc { font-size: .95em; color: var(--muted); }
  .preview .amt { font-size: 1.5em; font-weight: 700; color: var(--g1); }

  .list .item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .list .item:last-child { border-bottom: 0; }
  .item .main { flex: 1; min-width: 0; }
  .item .meta { color: var(--muted); font-size: .9em; }
  .del { background: var(--redbg); color: var(--red); border: 0; border-radius: 10px; padding: 7px 12px; font: inherit; font-size: .9em; cursor: pointer; flex: none; }
  .empty { color: var(--muted); text-align: center; padding: 18px 8px; }
  .note { color: var(--muted); font-size: .9em; margin: 8px 0 0; }
  .chip { padding: 2px 10px; border-radius: 999px; font-size: .82em; font-weight: 700; }
  .chip.ok { background: #dff5e6; color: var(--g1); }
  .chip.bad { background: var(--redbg); color: var(--red); }

  .summary { display: grid; grid-template-columns: repeat(4, 1fr); padding: 10px 8px; }
  .stat { text-align: center; padding: 8px 6px; border-left: 1px solid var(--line); }
  .stat:first-child { border-left: 0; }
  .stat .k { font-size: .85em; color: var(--muted); }
  .stat .v { font-size: 1.35em; font-weight: 700; color: var(--g1); }

  .tbl { width: 100%; border-collapse: collapse; font-size: .95em; }
  .tbl th, .tbl td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  .tbl th { color: var(--g1); background: var(--mint); font-weight: 700; }
  .tbl td.n { text-align: right; font-weight: 700; color: var(--g1); }
  .scroll { overflow-x: auto; }

  .calc-disp { font-size: 1.9em; font-weight: 700; color: var(--g1); text-align: right; background: var(--mint); border-radius: 14px; padding: 12px 14px; min-height: 64px; overflow: hidden; word-break: break-all; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .key { padding: 13px 0; border: 1px solid var(--line); border-radius: 14px; background: #fff; color: var(--g1); font: inherit; font-size: 1.15em; font-weight: 700; cursor: pointer; }
  .key:active { transform: scale(.97); }
  .key.op { background: var(--mint); }
  .key.eq { grid-row: span 2; background: linear-gradient(135deg, var(--g2), var(--g3)); color: #fff; border: 0; }
  .key.zero { grid-column: span 2; }
  .note-text { white-space: pre-wrap; margin-top: 4px; font-size: .95em; }
  .sub-h { font-size: 1em; color: var(--g1); margin: 18px 0 10px; font-weight: 700; }

  .prog-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .ph-left { display: flex; align-items: center; gap: 10px; }
  .ph-ic { width: 52px; height: 52px; display: inline-block; }
  .ph-ic img { width: 100%; height: 100%; object-fit: contain; }
  .prog-head h2 { margin: 0; font-size: 1.25em; color: var(--g1); }
  .prog-head small { color: var(--muted); }
  .seg { display: inline-flex; background: var(--mint); border-radius: 999px; padding: 4px; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font: inherit; font-weight: 600; color: var(--g1); cursor: pointer; }
  .seg button.on { background: var(--g2); color: #fff; }
  .datenav { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding: 10px 14px; font-weight: 700; color: var(--g1); }
  .datenav button { background: var(--mint); border: 0; color: var(--g1); width: 34px; height: 34px; border-radius: 50%; font-size: 1.2em; cursor: pointer; }
  .donut-card { margin-top: 12px; display: flex; align-items: center; gap: 14px; position: relative; }
  .ring { width: 118px; height: 118px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--g2) var(--p), #d9efe0 0); }
  .ring-in { width: 80%; height: 80%; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-in b { color: var(--g1); font-size: 1.2em; }
  .ring-in small { color: var(--muted); font-size: .75em; }
  .donut-info { display: flex; flex-direction: column; }
  .donut-info small { color: var(--muted); }
  .donut-info b { color: var(--g1); font-size: 1.4em; line-height: 1.2; }
  .badge-pct { position: absolute; right: 14px; top: 14px; width: 62px; height: 62px; border-radius: 50%; background: var(--mint); color: var(--g1); font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.05em; }
  .badge-pct small { font-size: .6em; font-weight: 600; color: var(--muted); }
  .mini4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
  .mini { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 6px; text-align: center; }
  .mini img { height: 44px; width: auto; max-width: 100%; object-fit: contain; }
  .mini small { display: block; color: var(--muted); font-size: .8em; margin-top: 4px; line-height: 1.3; }
  .mini b { color: var(--g1); font-size: .98em; }
  .bars { display: flex; gap: 6px; align-items: flex-end; }
  .bar-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar-col em { font-style: normal; font-size: .72em; color: var(--g1); font-weight: 700; white-space: nowrap; }
  .bar-track { height: 130px; width: 100%; display: flex; align-items: flex-end; justify-content: center; border-bottom: 1px solid var(--line); }
  .bar-fill { width: 70%; max-width: 30px; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, var(--g4), var(--g1)); }
  .bar-col span { font-size: .72em; color: var(--muted); white-space: nowrap; }
  .fin-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .ring2 { width: 130px; height: 130px; border-radius: 50%; flex: none; display: grid; place-items: center; }
  .lrow { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed var(--line); flex: 1; min-width: 180px; }
  .lrow:last-child { border-bottom: 0; }
  .lrow .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  .lrow b { color: var(--g1); }
  .tagline { text-align: center; color: var(--g1); background: #dff3e6; border-radius: 16px; padding: 12px; margin-top: 16px; font-size: .95em; font-weight: 600; }

  @media (max-width: 760px) {
    .menu { grid-template-columns: repeat(2, 1fr); }
    .menu.wide { grid-template-columns: 1fr; }
    .form { grid-template-columns: 1fr; }
    .tile { height: 96px; }
    .tile .art { width: 58px; height: 58px; }
    .tile .t { font-size: 1em; }
    .tile .s { font-size: .82em; }
  }
  @media (max-width: 600px) {
    .hero { grid-template-columns: 1fr 1fr; }
    .hero-sign { grid-column: 1 / -1; margin: 10px; font-size: 1.05em; }
    .hero-col img { height: 70px; }
    .hero-col .hv { font-size: 1.2em; }
    .menu { grid-template-columns: 1fr 1fr; gap: 10px; }
    .menu.two { grid-template-columns: 1fr 1fr; }
    .tile { padding: 8px; gap: 6px; }
    .tile .art { width: 52px; height: 52px; }
    .tile .t { font-size: .92em; }
    .tile .s { font-size: .78em; }
    .fin-strip { padding: 8px 2px; }
    .fin-i { padding: 4px 4px; }
    .fin-i small { font-size: .75em; }
    .fin-i b { font-size: .95em; }
    .summary { grid-template-columns: 1fr 1fr; row-gap: 10px; }
    .stat:nth-child(odd) { border-left: 0; }
    .mini4 { grid-template-columns: repeat(2, 1fr); }
    .ring { width: 100px; height: 100px; }
    .donut-card { flex-wrap: wrap; justify-content: center; text-align: center; }
    .donut-info { align-items: center; }
    .ai-robot { height: 60px; }
  }
  @media print {
    header.top, .btn, .del, form, .menu, .fin-strip, .no-print, .ai-banner { display: none !important; }
    body { background: #fff; }
    .card { box-shadow: none; }
  }
  .tile .art img.round { border-radius: 50%; object-fit: cover; }
     /* উপরের বার (লেয়ারের মতো) */

    /* ভেতরের পাতার হোম বোতাম */
  .hp-wrap { margin: 0 0 12px; }
  .hp { display: inline-flex; align-items: center; gap: 8px; background: #2d6a3e; color: #fff; border: 0; border-radius: 999px; padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  /* উপরের ছোট পেছনের চিহ্ন বাদ (হোম বোতাম আছে) */
  #back { display: none !important; }
</style></head>
<body>

<div id="hdr-bar">
  <div class="hb-top">
    <button class="hb-prof" data-hb="profile" aria-label="আমার প্রোফাইল">
      <span class="hb-avatar" id="hb-avatar"></span>
      <span class="hb-who"><b id="hb-name"></b><small id="hb-role"></small></span>
    </button>
    <button class="hb-logout" data-hb="logout" aria-label="লগআউট"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 3.5H6.2A2.7 2.7 0 0 0 3.5 6.2v11.6a2.7 2.7 0 0 0 2.7 2.7h3.3M15 8l4 4-4 4M19 12H9.5"/></svg><span>লগআউট</span></button>
  </div>
  <div class="hb-header">

// ---------- ডেটা (এই ব্রাউজারে সংরক্ষিত) ----------
const KEY = 'broilerFarm.v1';
const empty = () => ({
  batches: [], weights: [], feed: [], health: [], mortality: [], sales: [], expenses: [], notes: [],
  settings: { targetKgPerBird: 2.2 },
});
let db = empty();
function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY)) || {};
    const base = empty();
    return Object.assign(base, saved, { settings: Object.assign(base.settings, saved.settings || {}) });
  } catch (e) { return empty(); }
}
function save() { if (!READY) return; window.parent.postMessage({ type: 'farmsave', ft: FARM_FT, key: FARM_KEY, data: JSON.parse(JSON.stringify(db)) }, '*'); }
// ---------- অ্যাপের সাথে ডেটা সিঙ্ক (Firebase, Gmail অ্যাকাউন্টে) ----------
const FARM_FT = 'broiler';
const FARM_KEY = new URLSearchParams(location.search).get('fid') || FARM_FT;
let READY = false;
function isEmptyData(d) { return !d || Object.keys(d).every(k => !Array.isArray(d[k]) || d[k].length === 0); }
const LEGACY_LOCAL = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } })();
window.addEventListener('message', (e) => {
  if (e.source !== window.parent || !e.data || e.data.type !== 'farmdata') return;
  const remote = e.data.data;
  if (remote === null || remote === undefined) return; // অফলাইনে প্রথমবার ডেটা না পেলে সেভ বন্ধ থাকবে, ডেটা যেন না হারায়
  if (isEmptyData(remote) && LEGACY_LOCAL && !isEmptyData(LEGACY_LOCAL) && FARM_KEY === FARM_FT) {
    db = Object.assign(empty(), LEGACY_LOCAL);
    READY = true;
    save();
  } else {
    db = Object.assign(empty(), remote);
    READY = true;
  }
  try { render(); } catch (err) {}
});
window.parent.postMessage({ type: 'farmready', ft: FARM_FT, key: FARM_KEY }, '*');

// ---------- সাহায্যকারী ----------
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtDate = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => fmtDate(new Date());
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BN_DIGITS = '০১২৩৪৫৬৭৮৯';
const toBn = (s) => String(s).replace(/[0-9]/g, (d) => BN_DIGITS[d]);
const bn = (n) => Number(n || 0).toLocaleString('bn-BD', { maximumFractionDigits: 2 });
const UNITS = [[1e12, 'লক্ষ কোটি'], [1e7, 'কোটি'], [1e5, 'লাখ'], [1e3, 'হাজার']];
function compactNum(n) {
  const v = Number(n) || 0, a = Math.abs(v), sign = v < 0 ? '−' : '';
  for (const [unit, label] of UNITS) if (a >= unit) return sign + bn(Number((a / unit).toFixed(2))) + ' ' + label;
  return sign + bn(a);
}
const money = (n) => '৳ ' + compactNum(n);
const sum = (arr, f) => arr.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const feedKgOf = (f) => (f.kg != null ? f.kg : f.qty);
const batchName = (id) => { const b = db.batches.find((x) => x.id === id); return b ? b.name : 'সাধারণ'; };

// ব্যাচ-ভিত্তিক হিসাব
function batchDead(id) { return sum(db.mortality.filter((m) => m.batchId === id), (m) => m.count); }
function batchSold(id) { return sum(db.sales.filter((s) => s.batchId === id), (s) => s.birds); }
function batchLive(id) {
  const b = db.batches.find((x) => x.id === id);
  return b ? Math.max(0, b.chicks - batchDead(id) - batchSold(id)) : 0;
}
function liveBirds() { return sum(db.batches, (b) => batchLive(b.id)); }
function placedBirds() { return sum(db.batches, (b) => b.chicks); }
function latestAvgKg() {
  const w = [...db.weights].sort((a, b) => b.date.localeCompare(a.date))[0];
  return w ? w.avgKg : 0;
}

let HOME_BATCH = '';
function totals(bid = '') {
  const ym = today().slice(0, 7);
  const f = (arr) => (bid ? arr.filter((x) => x.batchId === bid) : arr);
  const feedIn = sum(f(db.feed).filter((x) => x.type === 'in'), feedKgOf);
  const feedOut = sum(f(db.feed).filter((x) => x.type === 'out'), feedKgOf);
  const totalSales = sum(f(db.sales), (s) => s.total);
  const feedCost = sum(f(db.feed).filter((x) => x.type === 'in'), (x) => x.price);
  const totalExp = sum(f(db.expenses), (e) => e.amount) + feedCost;
  return {
    live: bid ? batchLive(bid) : liveBirds(),
    deadToday: sum(f(db.mortality).filter((m) => m.date === today()), (m) => m.count),
    feedStock: feedIn - feedOut, feedIn, feedOut, feedCost,
    totalSales, totalExp, profit: totalSales - totalExp,
    monthSales: sum(f(db.sales).filter((s) => s.date && s.date.startsWith(ym)), (s) => s.total),
  };
}

// ---------- পিরিয়ড ----------
const WEEK_BN = ['শনি', 'রবি', 'সোম', 'মঙ্গল', 'বুধ', 'বৃহ', 'শুক্র'];
const MONTHS = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
const MON_SHORT = ['জানু', 'ফেব্রু', 'মার্চ', 'এপ্রি', 'মে', 'জুন', 'জুলা', 'আগ', 'সেপ্টে', 'অক্টো', 'নভে', 'ডিসে'];
const PLBL = { week: 'সপ্তাহ', month: 'মাস', year: 'বছর' };
let prog = { period: 'week', anchor: (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })() };

function periodRange() {
  const a = new Date(prog.anchor);
  if (prog.period === 'week') {
    const s = new Date(a); s.setDate(a.getDate() - ((a.getDay() + 1) % 7));
    const e = new Date(s); e.setDate(s.getDate() + 6);
    return { start: s, end: e };
  }
  if (prog.period === 'month') return { start: new Date(a.getFullYear(), a.getMonth(), 1), end: new Date(a.getFullYear(), a.getMonth() + 1, 0) };
  return { start: new Date(a.getFullYear(), 0, 1), end: new Date(a.getFullYear(), 11, 31) };
}
function periodLabel() {
  const { start, end } = periodRange();
  if (prog.period === 'year') return toBn(start.getFullYear());
  if (prog.period === 'month') return `${MONTHS[start.getMonth()]} ${toBn(start.getFullYear())}`;
  const sameMonth = start.getMonth() === end.getMonth();
  return `${bn(start.getDate())} - ${bn(end.getDate())} ${sameMonth ? '' : MONTHS[start.getMonth()] + ' '}${MONTHS[end.getMonth()]} ${toBn(end.getFullYear())}`;
}
function inPeriod(dateStr) {
  if (!dateStr) return false;
  const { start, end } = periodRange();
  return dateStr >= fmtDate(start) && dateStr <= fmtDate(end);
}
function shiftPeriod(dir) {
  const a = new Date(prog.anchor);
  if (prog.period === 'week') a.setDate(a.getDate() + 7 * dir);
  else if (prog.period === 'month') a.setMonth(a.getMonth() + dir);
  else a.setFullYear(a.getFullYear() + dir);
  prog.anchor = a;
}
function progStats() {
  const { start, end } = periodRange();
  const sales = db.sales.filter((s) => inPeriod(s.date));
  const soldKg = sum(sales, (s) => s.kg);
  const revenue = sum(sales, (s) => s.total);
  const expenses = sum(db.expenses.filter((e) => inPeriod(e.date)), (e) => e.amount)
    + sum(db.feed.filter((f) => f.type === 'in' && inPeriod(f.date)), (f) => f.price);
  const days = Math.round((end - start) / 864e5) + 1;
  const soldBirds = sum(db.sales, (s) => s.birds);
  const placed = placedBirds();
  const feedUsedAll = sum(db.feed.filter((f) => f.type === 'out'), feedKgOf);
  const soldKgAll = sum(db.sales, (s) => s.kg);
  return {
    soldKg, revenue, expenses, days,
    dead: sum(db.mortality.filter((m) => inPeriod(m.date)), (m) => m.count),
    feedKg: sum(db.feed.filter((f) => f.type === 'out' && inPeriod(f.date)), feedKgOf),
    pct: placed ? Math.min(100, Math.round(soldBirds / placed * 100)) : 0,
    fcr: soldKgAll > 0 ? (feedUsedAll / soldKgAll) : 0,
    profit: revenue - expenses,
    margin: revenue > 0 ? Math.round((revenue - expenses) / revenue * 100) : 0,
  };
}
function periodBuckets() {
  const { start, end } = periodRange();
  if (prog.period === 'week') {
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const key = fmtDate(d);
      return { label: WEEK_BN[i], value: sum(db.sales.filter((s) => s.date === key), (s) => s.kg) };
    });
  }
  if (prog.period === 'month') {
    const y = start.getFullYear(), m = start.getMonth(), days = end.getDate();
    return Array.from({ length: Math.ceil(days / 7) }, (_, i) => {
      const from = fmtDate(new Date(y, m, 1 + i * 7));
      const to = fmtDate(new Date(y, m, Math.min(days, (i + 1) * 7)));
      return { label: 'সপ্তাহ ' + bn(i + 1), value: sum(db.sales.filter((s) => s.date >= from && s.date <= to), (s) => s.kg) };
    });
  }
  const y = start.getFullYear();
  return MON_SHORT.map((label, m) => {
    const key = y + '-' + String(m + 1).padStart(2, '0');
    return { label, value: sum(db.sales.filter((s) => s.date && s.date.startsWith(key)), (s) => s.kg) };
  });
}
function barsTitle() {
  return prog.period === 'week' ? 'দৈনিক বিক্রয় (কেজি)' : prog.period === 'month' ? 'সাপ্তাহিক বিক্রয় (কেজি)' : 'মাসভিত্তিক বিক্রয় (কেজি)';
}

// ---------- ক্যালকুলেটর/ফিড ছোট সাহায্যকারী ----------
function feedUnitLabel(f) {
  return f.unit === 'bag' ? `${bn(f.qty)} বস্তা (${bn(f.kg)} কেজি)` : `${bn(feedKgOf(f))} কেজি`;
}

// ---------- UI ছোট অংশ ----------
function stat(k, v) { return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`; }
function tile(id, img, title, sub, cls = '', round = false) {

function finStrip(t, clickable) {

}

// ---------- বিক্রয় ও ফিড প্রিভিউ ----------
function updateSale(form) {
  if (!form) return;
  const birds = Number(form.birds.value) || 0;
  const kg = Number(form.kg.value) || 0;
  const price = Number(form.unit.value) || 0;
  form.querySelector('[data-calc-out]').textContent = `${bn(kg)} কেজি × ${money(price)} = `;
  form.querySelector('[data-amt]').textContent = money(kg * price);
}
function updateFeed(form) {
  if (!form) return;
  const picked = form.querySelector('input[name="unit"]:checked');
  const unit = picked ? picked.value : '';
  const qty = Number(form.qty.value) || 0;
  const bag = Number(form.bagKg.value) || 0;
  const kg = unit === 'bag' ? qty * bag : qty;
  form.querySelector('[data-fqlabel]').textContent = unit === 'bag' ? 'বস্তার সংখ্যা' : unit === 'kg' ? 'কেজির পরিমাণ' : 'পরিমাণ';
  form.querySelector('[data-fcalc]').textContent = !unit
    ? 'কেজি না বস্তা, আগে বেছে নিন'
    : unit === 'bag' ? `${bn(qty)} বস্তা × ${bn(bag)} কেজি = ` : `${bn(qty)} কেজি`;
  form.querySelector('[data-famt]').textContent = unit ? `${bn(kg)} কেজি` : '—';
}

// ---------- ফর্ম সেভ ----------
const HANDLERS = {
  batch(d) {
    const chicks = Number(d.chicks);
    if (!d.name.trim() || !(chicks > 0)) return false;
    db.batches.push({ id: uid(), name: d.name.trim(), breed: (d.breed || '').trim(), chicks, date: d.date || today() });
  },
  weight(d) {
    if (!d.batchId || !(Number(d.avgKg) > 0)) return false;
    db.weights.push({ id: uid(), batchId: d.batchId, avgKg: Number(d.avgKg), date: d.date || today() });
  },
  feed(d) {
    const qty = Number(d.qty), bag = Number(d.bagKg) || 0;
    if (!d.unit || !(qty > 0)) return false;
    if (d.unit === 'bag' && !(bag > 0)) return false;
    const kg = d.unit === 'bag' ? qty * bag : qty;
    db.feed.push({ id: uid(), type: d.type, name: (d.name || '').trim(), unit: d.unit, qty,
      bagKg: d.unit === 'bag' ? bag : 0, kg, price: d.type === 'in' ? (Number(d.price) || 0) : 0, date: d.date || today() });
  },
  health(d) {
    db.health.push({ id: uid(), batchId: d.batchId || '', type: d.type, medicine: (d.medicine || '').trim(),
      cost: Number(d.cost) || 0, note: (d.note || '').trim(), date: d.date || today() });
  },
  mortality(d) {
    const count = Number(d.count);
    if (!d.batchId || !(count > 0)) return false;
    db.mortality.push({ id: uid(), batchId: d.batchId, count, cause: d.cause, date: d.date || today() });
  },
  sale(d) {
    const birds = Number(d.birds), kg = Number(d.kg), price = Number(d.unit);
    if (!d.batchId || !(birds > 0) || !(kg > 0) || !(price >= 0)) return false;
    db.sales.push({ id: uid(), batchId: d.batchId, birds, kg, unit: price, total: kg * price, date: d.date || today() });
  },
  expense(d) {
    const amount = Number(d.amount);
    if (!(amount > 0)) return false;
    db.expenses.push({ id: uid(), item: (d.item || '').trim(), amount, date: d.date || today() });
  },
  note(d) {
    if (!(d.text || '').trim()) return false;
    db.notes.push({ id: uid(), title: (d.title || '').trim(), text: d.text.trim(), date: d.date || today() });
  },
};
const LISTS = { weight: 'weights', feed: 'feed', health: 'health', mortality: 'mortality', sale: 'sales', expense: 'expenses', note: 'notes' };

function removeItem(kind, id) {
  if (kind === 'batch') {
    db.batches = db.batches.filter((b) => b.id !== id);
    db.weights = db.weights.filter((w) => w.batchId !== id);
    db.health = db.health.filter((h) => h.batchId !== id);
    db.mortality = db.mortality.filter((m) => m.batchId !== id);
    db.sales = db.sales.filter((s) => s.batchId !== id);
  } else {
    const key = LISTS[kind];
    db[key] = db[key].filter((x) => x.id !== id);
  }
  save();
}

// ---------- পাতা চালানো ----------
let view = 'home';
const app = document.getElementById('app');
const titleEl = document.getElementById('title');
const backBtn = document.getElementById('back');

function render() {
  titleEl.textContent = TITLES[view];
  backBtn.hidden = view === 'home';
  // উপরের বার শুধু প্রথম (ড্যাশবোর্ড) পাতায়
  const hdrBar = document.getElementById('hdr-bar');
  if (hdrBar) hdrBar.style.display = view === 'home' ? '' : 'none';
  app.innerHTML = VIEWS[view]();
  // ভেতরের পাতায় হোম বোতাম (লেয়ারের মতো)
  if (view !== 'home') app.insertAdjacentHTML('afterbegin', '<div class="hp-wrap"><button class="hp" type="button" data-hp="home"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>হোম</span></button></div>');
  if (view === 'finance') updateSale(app.querySelector('form[data-form="sale"]'));
  if (view === 'feed') updateFeed(app.querySelector('form[data-form="feed"]'));
}
function go(name, fromHistory) {
  name = name in VIEWS ? name : 'home';
  const cur = history.state && history.state.view;
  if (!fromHistory) {
    // কোনো পাতা থেকে হোমে ফেরা = এক ধাপ ব্যাক
    if (name === 'home' && cur && cur !== 'home') { history.back(); return; }
    if (name !== 'home') {
      if (cur === 'home') history.pushState({ view: name }, '');
      else history.replaceState({ view: name }, '');
    }
  }
  view = name;
  window.scrollTo(0, 0);
  render();
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2000);
}

// ---------- ব্যাক বাটন: হোমে দুইবার চাপলে তবেই অ্যাপ থেকে বের ----------
// history: [guard] -> [home] -> [পাতা...]
history.replaceState({ guard: true }, '');
history.pushState({ view: 'home' }, '');
let exitArmed = false;
window.addEventListener('popstate', (e) => {
  const st = e.state || {};
  if (st.guard) {
    // হোম থেকে ব্যাক চাপা হয়েছে
    if (exitArmed) { history.back(); return; } // দ্বিতীয়বার: বের হয়ে যাবে
    exitArmed = true;
    showToast('আবার ব্যাক চাপলে অ্যাপ থেকে বের হবে');
    setTimeout(() => { exitArmed = false; }, 2000);
    history.pushState({ view: 'home' }, '');
    go('home', true);
    return;
  }
  go(st.view || 'home', true);
});
backBtn.addEventListener('click', () => go('home'));

document.addEventListener('click', (e) => {
  if (e.target.closest && e.target.closest('[data-hp]')) { go('home'); return; }
  const goEl = e.target.closest('[data-go]');
  if (goEl && goEl.classList.contains('tile')) {
    goEl.classList.add('pressed');
    const target = goEl.dataset.go;
    return setTimeout(() => go(target), 170);
  }
  if (goEl) return go(goEl.dataset.go);

  const pb = e.target.closest('[data-prog]');
  if (pb) { prog.period = pb.dataset.prog; return render(); }
  const nb = e.target.closest('[data-nav]');
  if (nb) { shiftPeriod(Number(nb.dataset.nav)); return render(); }

  const del = e.target.closest('[data-del]');
  if (del) {
    const msg = del.dataset.del === 'batch'
      ? 'এই ব্যাচ ও এর সব রেকর্ড মুছে যাবে। নিশ্চিত?'
      : 'এই রেকর্ডটি মুছে যাবে। নিশ্চিত?';
    if (!confirm(msg)) return;
    removeItem(del.dataset.del, del.dataset.id);
    return render();
  }
  if (e.target.closest('[data-action="print"]')) return window.print();
  if (e.target.closest('.ai-banner')) return showToast('AI সহকারী শীঘ্রই আসছে');
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  if (HANDLERS[form.dataset.form](data) === false) { alert('তথ্যগুলো ঠিকভাবে দিন।'); return; }
  save();
  render();
});

function refreshPreview(form) {
  const name = form.dataset.form;
  if (name === 'sale') updateSale(form);
  if (name === 'feed') updateFeed(form);
}
document.addEventListener('input', (e) => {
  const form = e.target.closest('form[data-form]');
  if (form) refreshPreview(form);
});
document.addEventListener('change', (e) => {
  if (e.target.name === 'target') {
    db.settings.targetKgPerBird = Number(e.target.value) || 0;
    save();
    return render();
  }
  const form = e.target.closest('form[data-form]');
  if (form) refreshPreview(form);
});

render();

    (function () {

          const o = document.createElement('option');
          o.value = f.id; o.textContent = f.name || '';
          if (f.id === d.current) o.selected = true;
          selEl.appendChild(o);
        });
      }
      document.querySelectorAll('#hdr-bar [data-hb]').forEach(b => {
        b.addEventListener('click', () => window.parent.postMessage({ type: 'hdraction', action: b.getAttribute('data-hb') }, '*'));
      });
      selEl.addEventListener('change', () => window.parent.postMessage({ type: 'hdraction', action: 'farm', value: selEl.value }, '*'));
      window.addEventListener('message', (e) => {
        if (e.source !== window.parent || !e.data || e.data.type !== 'hdrdata') return;
        fillBar(e.data);
      });
      window.parent.postMessage({ type: 'hdrready' }, '*');
    })();

document.addEventListener('change', (e) => { if (e.target && e.target.id === 'home-batch') { HOME_BATCH = e.target.value; render(); } });
</script>
</body>
</html>
