<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>মাছের খামার</title>
<meta name="theme-color" content="#1f7a43">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --g1: #14532d; --g2: #1f7a43; --g3: #2e9d5a; --g4: #3fbf6a;
    --mint: #e8f6ec; --line: #d3e7da; --ink: #1d2a22; --muted: #5b6b61;
    --bg: #f2f9f4; --red: #b42318; --redbg: #fdecea;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Noto Sans Bengali", system-ui, sans-serif;
    background: linear-gradient(180deg, #eaf8ee 0%, var(--bg) 40%, #f7fbf8 100%);
    color: var(--ink); min-height: 100vh; line-height: 1.5;
  }
  [hidden] { display: none !important; }

  header.top {
    background: linear-gradient(90deg, #15673a, var(--g2) 60%, #23874d);
    color: #fff; display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 12px rgba(20, 83, 45, .28);
  }
  header.top h1 { font-size: 1.25em; margin: 0; font-weight: 800; letter-spacing: .2px; }
  .back {
    background: rgba(255, 255, 255, .18); border: 0; color: #fff;
    width: 38px; height: 38px; border-radius: 50%; font-size: 1.3em; cursor: pointer; flex: none;
  }
  .back:focus-visible, .tile:focus-visible, .fin-strip:focus-visible, .btn:focus-visible { outline: 3px solid var(--g4); outline-offset: 2px; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }

  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 18px;
    padding: 16px; box-shadow: 0 2px 10px rgba(20, 83, 45, .06);
  }
  .section { margin-top: 16px; }
  h2.sec { font-size: 1.05em; color: var(--g1); margin: 0 0 12px; }

  /* উপরের সারসংক্ষেপ: ছবি + ৪টি তথ্য এক সারিতে */
  .hero { display: grid; grid-template-columns: 1fr 3fr; align-items: center; padding: 0; overflow: hidden;
    background: linear-gradient(90deg, #f7fff9, #eefaf2 70%, #e2f5e8); }
  .hero-photo img { display: block; width: 100%; height: auto; object-fit: contain; }
  .hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; }
  .hstat { display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 8px 4px; border-left: 1px solid var(--line); }
  .hstat img { height: 46px; width: auto; max-width: 100%; object-fit: contain; }
  .hstat .k { font-size: .75em; color: var(--muted); margin-top: 2px; line-height: 1.3; }
  .hstat .v { font-weight: 800; color: var(--g1); font-size: 1em; line-height: 1.3; }

  /* মেনু: ৩ কলাম, ২ সারি */
  .menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
  .tile {
    display: flex; align-items: center; gap: 8px; min-width: 0; text-align: left;
    cursor: pointer; font: inherit; color: inherit;
    background: linear-gradient(180deg, #ffffff, #f6fcf8); border: 2px solid var(--g4);
    border-radius: 16px; padding: 8px 10px; box-shadow: 0 2px 8px rgba(20, 83, 45, .06);
    transition: transform .15s, box-shadow .15s;
  }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(20, 83, 45, .14); }
  .tile .art { width: 56px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; }
  .tile .art img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .tile .t { flex: 1; min-width: 0; font-weight: 700; color: var(--g1); font-size: .85em; line-height: 1.3; }
  .tile .arr {
    flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: var(--g2); color: #fff; font-size: 1.05em; font-weight: 700;
  }
  .menu.three { grid-template-columns: repeat(3, 1fr); }
  .tile .art svg { width: 100%; height: 100%; }
  .tile.hi { background: linear-gradient(135deg, #f3fff6, #ffffff); }
  .tile:active, .tile.pressed {
    background: linear-gradient(135deg, var(--g3), var(--g1)); border-color: var(--g1); transform: scale(.98);
    box-shadow: 0 6px 16px rgba(20, 83, 45, .35);
  }
  .tile:active .t, .tile.pressed .t { color: #fff; }

  /* নিচের আর্থিক সারসংক্ষেপ */
  .fin-strip { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); padding: 8px 4px;
    cursor: pointer; font: inherit; color: inherit; text-align: left; }
  .fin-strip.plain { cursor: default; }
  .fin-i { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-left: 1px solid var(--line); min-width: 0; }
  .fin-i:first-child { border-left: 0; }
  .fin-i img { width: 40px; height: 40px; object-fit: contain; flex: none; }
  .fin-i small { display: block; color: var(--muted); font-size: .75em; line-height: 1.3; }
  .fin-i b { display: block; color: var(--g1); font-size: .95em; line-height: 1.3; }
  .fin-i b.neg { color: var(--red); }

  /* ===== AI-BANNER:START (পরে সরাতে এই CSS ব্লক ও HTML ব্লক মুছে ফেলুন) ===== */
  .ai-banner { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 8px 14px 8px 8px;
    background: linear-gradient(90deg, #e9f9ef, #f5fffa 60%, #dff4ea); border-radius: 18px; }
  .ai-robot { height: 78px; width: auto; flex: none; object-fit: contain; }
  .ai-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ai-text b { color: var(--g1); font-size: 1.05em; }
  .ai-text span { color: var(--muted); font-size: .85em; }
  .ai-btn { flex: none; background: linear-gradient(90deg, var(--g2), var(--g3)); color: #fff; border: 0;
    border-radius: 999px; padding: 10px 16px; font: inherit; font-weight: 700; font-size: .9em; cursor: pointer;
    box-shadow: 0 4px 12px rgba(31, 122, 67, .3); }
  .ai-btn:focus-visible { outline: 3px solid var(--g4); outline-offset: 2px; }
  @media (max-width: 600px) { .ai-robot { height: 56px; } .ai-btn { padding: 8px 12px; font-size: .8em; } }
  /* ===== AI-BANNER:END ===== */
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #1d2a22; color: #fff;
    padding: 11px 20px; border-radius: 12px; display: none; font-size: .95em; z-index: 50; }
  .toast.show { display: block; }

  /* ক্যালকুলেটর ও নোট */
  textarea { font: inherit; font-size: 1rem; color: var(--ink); width: 100%; padding: 11px 12px;
    border: 1px solid var(--line); border-radius: 12px; background: #fbfefc; min-height: 90px; resize: vertical; }
  textarea:focus { outline: 2px solid var(--g3); border-color: transparent; }
  .sub-h { font-size: .95em; color: var(--g1); margin: 18px 0 10px; font-weight: 700; }
  .calc-disp { font-size: 1.9em; font-weight: 800; color: var(--g1); text-align: right; background: var(--mint);
    border-radius: 14px; padding: 12px 14px; min-height: 64px; overflow: hidden; word-break: break-all; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .key { padding: 13px 0; border: 1px solid var(--line); border-radius: 14px; background: #fff; color: var(--g1);
    font: inherit; font-size: 1.15em; font-weight: 700; cursor: pointer; }
  .key:active { transform: scale(.97); }
  .key.op { background: var(--mint); }
  .key.eq { grid-row: span 2; background: linear-gradient(135deg, var(--g2), var(--g3)); color: #fff; border: 0; }
  .key.zero { grid-column: span 2; }
  .key:focus-visible { outline: 3px solid var(--g3); outline-offset: 2px; }
  .helper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .helper-out { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .helper-out div { background: linear-gradient(90deg, #e8f6ec, #f7fff9); border: 1px dashed var(--g3); border-radius: 14px; padding: 10px 12px; }
  .helper-out small { color: var(--muted); display: block; font-size: .85em; }
  .helper-out b { color: var(--g1); font-size: 1.25em; }
  .note-text { white-space: pre-wrap; color: var(--ink); margin-top: 4px; font-size: .95em; }
  @media (max-width: 600px) { .helper { grid-template-columns: 1fr; } .helper-out { grid-template-columns: 1fr; } }

  /* প্রগ্রেস পাতা */
  .ov-top { display: grid; grid-template-columns: 1fr 3fr; gap: 12px; margin-bottom: 12px; }
  .ov-top .summary { margin: 0; }
  .prog-tile { flex-direction: column; justify-content: center; text-align: center; min-height: 150px; }
  .prog-tile .art { width: 66px; height: 66px; }
  .prog-tile .t { flex: none; padding: 0; }
  .prog-tile .arr { display: none; }
  .prog-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .ph-left { display: flex; align-items: center; gap: 10px; }
  .ph-ic { width: 48px; height: 48px; display: inline-block; }
  .ph-ic svg { width: 100%; height: 100%; }
  .prog-head h2 { margin: 0; font-size: 1.25em; color: var(--g1); }
  .prog-head small { color: var(--muted); }
  .seg { display: inline-flex; background: var(--mint); border-radius: 999px; padding: 4px; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font: inherit; font-weight: 600; color: var(--g1); cursor: pointer; }
  .seg button.on { background: var(--g2); color: #fff; }
  .datenav { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding: 10px 14px; font-weight: 700; color: var(--g1); }
  .datenav button { background: var(--mint); border: 0; color: var(--g1); width: 34px; height: 34px; border-radius: 50%; font-size: 1.2em; cursor: pointer; }
  .donut-card { margin-top: 12px; display: flex; align-items: center; gap: 14px; position: relative; }
  .ring { width: 118px; height: 118px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: conic-gradient(var(--g2) var(--p), #d9efe0 0); }
  .ring-in { width: 80%; height: 80%; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-in b { color: var(--g1); font-size: 1.25em; }
  .ring-in small { color: var(--muted); font-size: .75em; }
  .donut-info { display: flex; flex-direction: column; }
  .donut-info small { color: var(--muted); }
  .donut-info b { color: var(--g1); font-size: 1.45em; line-height: 1.2; }
  .badge-pct { position: absolute; right: 14px; top: 14px; width: 62px; height: 62px; border-radius: 50%;
    background: var(--mint); color: var(--g1); font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.05em; }
  .badge-pct small { font-size: .6em; font-weight: 600; color: var(--muted); }
  .mini4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
  .mini { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 6px; text-align: center; }
  .mini img { height: 40px; width: auto; max-width: 100%; object-fit: contain; }
  .mini small { display: block; color: var(--muted); font-size: .75em; margin-top: 4px; line-height: 1.3; }
  .mini b { color: var(--g1); font-size: .95em; }
  .bars { display: flex; gap: 6px; align-items: flex-end; }
  .bar-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar-col em { font-style: normal; font-size: .7em; color: var(--g1); font-weight: 700; white-space: nowrap; }
  .bar-track { height: 130px; width: 100%; display: flex; align-items: flex-end; justify-content: center;
    border-bottom: 1px solid var(--line); }
  .bar-fill { width: 70%; max-width: 30px; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, var(--g4), var(--g1)); }
  .bar-col span { font-size: .7em; color: var(--muted); white-space: nowrap; }
  .fin-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .ring2 { width: 130px; height: 130px; border-radius: 50%; flex: none; display: grid; place-items: center; }
  .ring2 .ring-in small { font-size: .8em; }
  .lrow { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed var(--line); flex: 1; min-width: 180px; }
  .lrow:last-child { border-bottom: 0; }
  .lrow .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  .lrow b { color: var(--g1); }
  .tagline { text-align: center; color: var(--g1); background: #e4f5ea; border-radius: 16px; padding: 12px; margin-top: 16px; font-size: .92em; }
  @media (max-width: 600px) {
    .ov-top { grid-template-columns: 1fr; }
    .mini4 { grid-template-columns: repeat(2, 1fr); }
    .donut-card { flex-wrap: wrap; justify-content: center; text-align: center; }
    .donut-info { align-items: center; }
    .ring { width: 100px; height: 100px; }
    .bar-track { height: 110px; }
  }

  .stat { text-align: center; padding: 8px 6px; border-left: 1px solid var(--line); }
  .stat:first-child { border-left: 0; }
  .stat .k { font-size: .85em; color: var(--muted); }
  .stat .v { font-size: 1.35em; font-weight: 800; color: var(--g1); }
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); padding: 10px 8px; }

  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form .full { grid-column: 1 / -1; }
  label.f { font-size: .9em; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
  input, select {
    font: inherit; font-size: 1rem; color: var(--ink);
    padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: #fbfefc; width: 100%;
  }
  input:focus, select:focus { outline: 2px solid var(--g3); border-color: transparent; }
  .btn {
    background: linear-gradient(90deg, var(--g2), var(--g3)); color: #fff; border: 0;
    border-radius: 999px; padding: 12px 22px; font: inherit; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 12px rgba(31, 122, 67, .3);
  }
  .btn.ghost { background: var(--mint); color: var(--g1); box-shadow: none; }

  .pill { position: relative; display: inline-block; }
  .pill input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .pill span {
    display: inline-block; padding: 9px 18px; border-radius: 999px;
    background: var(--mint); color: var(--g1); font-weight: 600; cursor: pointer;
  }
  .pill input:checked + span { background: var(--g2); color: #fff; }
  .pill input:focus-visible + span { outline: 3px solid var(--g3); outline-offset: 2px; }
  .pills { display: flex; gap: 10px; flex-wrap: wrap; }

  .preview {
    background: linear-gradient(90deg, #e8f6ec, #f7fff9); border: 1px dashed var(--g3);
    border-radius: 14px; padding: 12px 14px;
  }
  .preview .calc { font-size: .95em; color: var(--muted); }
  .preview .amt { font-size: 1.5em; font-weight: 800; color: var(--g1); }

  .list .item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
  .list .item:last-child { border-bottom: 0; }
  .item .main { flex: 1; min-width: 0; }
  .item .meta { color: var(--muted); font-size: .88em; }
  .del {
    background: var(--redbg); color: var(--red); border: 0; border-radius: 10px;
    padding: 7px 12px; font: inherit; font-size: .9em; cursor: pointer; flex: none;
  }
  .empty { color: var(--muted); text-align: center; padding: 18px 8px; }
  .note { color: var(--muted); font-size: .88em; margin: 8px 0 0; }

  .chip { padding: 2px 10px; border-radius: 999px; font-size: .8em; font-weight: 700; white-space: nowrap; }
  .chip.ok { background: #dff5e6; color: var(--g1); }
  .chip.bad { background: var(--redbg); color: var(--red); }

  .tbl { width: 100%; border-collapse: collapse; font-size: .95em; }
  .tbl th, .tbl td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  .tbl th { color: var(--g1); background: var(--mint); font-weight: 700; }
  .tbl td.n { text-align: right; font-weight: 700; color: var(--g1); }
  .scroll { overflow-x: auto; }

  @media (max-width: 600px) {
    .hero { grid-template-columns: 1fr; }
    
    .hstat img { height: 34px; }
    .hstat .k { font-size: .7em; }
    .hstat .v { font-size: .9em; }
    .tile { padding: 6px 7px; gap: 6px; }
    .tile .art { width: 44px; height: 44px; }
    .tile .t { font-size: .78em; }
    .tile .arr { width: 22px; height: 22px; font-size: .95em; }
    .fin-i img { width: 32px; height: 32px; }
    .fin-i small { font-size: .7em; }
    .fin-i b { font-size: .85em; }
    .summary { grid-template-columns: 1fr 1fr; row-gap: 10px; }
    .stat:nth-child(odd) { border-left: 0; }
  }
  @media print {
    header.top, .btn, .del, form, .menu, .fin-strip, .no-print { display: none !important; }
    body { background: #fff; }
    .card { box-shadow: none; }
  }
     /* উপরের বার (লেয়ারের মতো) */
    #hdr-bar{max-width:760px;margin:0 auto;padding:12px 14px 0;box-sizing:border-box;}
    #hdr-bar .hb-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;padding:10px 12px;border-radius:16px;background:linear-gradient(135deg,#17402a,#2d6a3e);color:#fff;box-shadow:0 4px 14px rgba(23,64,42,.25);}
    #hdr-bar .hb-prof{display:flex;align-items:center;gap:12px;background:none;border:0;color:#fff;padding:0;text-align:left;min-width:0;flex:1;cursor:pointer;font:inherit;}
    #hdr-bar .hb-who{display:block;min-width:0;}
    #hdr-bar .hb-who b{display:block;font-size:1.15rem;font-weight:600;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    #hdr-bar .hb-who small{display:inline-block;font-size:.85rem;background:rgba(255,255,255,.18);padding:0 10px;border-radius:10px;line-height:1.5;}
    #hdr-bar .hb-logout{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);padding:8px 12px;flex:none;border-radius:12px;cursor:pointer;font:inherit;}
    #hdr-bar .hb-logout svg{width:18px;height:18px;}
    #hdr-bar .hb-avatar{width:48px;height:48px;border-radius:50%;background:#e6f0e8;color:#17402a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;overflow:hidden;border:2px solid rgba(255,255,255,.9);flex:none;}
    #hdr-bar .hb-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
    #hdr-bar .hb-header{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
    #hdr-bar .hb-row{flex-basis:100%;display:flex;justify-content:flex-end;}
    #hdr-bar .hb-header select{flex:1;font-weight:700;padding:10px;border:1px solid #d6ddd1;border-radius:12px;background:#fff;font:inherit;min-width:0;}
    #hdr-bar .hb-header button{background:#fff;border:1px solid #d6ddd1;border-radius:12px;padding:10px 12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;}
    #hdr-bar .hb-farmlist{display:inline-flex;align-items:center;gap:8px;}

  
  /* মেনু ঘর: সব ঘর একই মাপে, লেখা ঘরের ভেতরে থাকবে */
  .menu.three .tile { flex-direction: column; align-items: center; justify-content: center; text-align: center; min-width: 0; }
  .menu.three .tile .t { width: 100%; overflow-wrap: anywhere; word-break: break-word; font-size: .8em; }
  /* ভেতরের পাতার হোম বোতাম */
  .hp-wrap { margin: 0 0 12px; }
  .hp { display: inline-flex; align-items: center; gap: 8px; background: #2d6a3e; color: #fff; border: 0; border-radius: 999px; padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  /* উপরের ছোট পেছনের চিহ্ন বাদ (হোম বোতাম আছে) */
  #back { display: none !important; }
  /* এই মাসের বিক্রয় আইকন একটু নিচে (অন্যদের সমান লাইনে) */
  .hero-stats > *:nth-child(4) img { transform: translateY(8px); }
</style>
</head>
<body>

<div id="hdr-bar">
  <div class="hb-top">
    <button class="hb-prof" data-hb="profile" aria-label="আমার প্রোফাইল">
      <span class="hb-avatar" id="hb-avatar"></span>

// ---------- ডেটা সংরক্ষণ (এই ব্রাউজারে). পরে Firebase-এর সঙ্গে যুক্ত হবে ----------
const KEY = 'fishFarm.v1';
const empty = () => ({ ponds: [], stocks: [], feed: [], health: [], water: [], sales: [], expenses: [], notes: [] });
let db = empty();
function load() {
  try { return Object.assign(empty(), JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch (e) { return empty(); }
}
function save() { if (!READY) return; window.parent.postMessage({ type: 'farmsave', ft: FARM_FT, key: FARM_KEY, data: JSON.parse(JSON.stringify(db)) }, '*'); }
// ---------- অ্যাপের সাথে ডেটা সিঙ্ক (Firebase, Gmail অ্যাকাউন্টে) ----------
const FARM_FT = 'fish';
const FARM_KEY = new URLSearchParams(location.search).get('fid') || FARM_FT;
let READY = false;
function isEmptyData(d) { return !d || Object.keys(d).every(k => !Array.isArray(d[k]) || d[k].length === 0); }
const LEGACY_LOCAL = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } })();
window.addEventListener('message', (e) => {
  if (e.source !== window.parent || !e.data || e.data.type !== 'farmdata') return;
  const remote = e.data.data;
  if (remote === null || remote === undefined) return; // অফলাইনে প্রথমবার ডেটা না পেলে সেভ বন্ধ থাকবে, ডেটা যেন না হারায়
  if (isEmptyData(remote) && LEGACY_LOCAL && !isEmptyData(LEGACY_LOCAL) && FARM_KEY === FARM_FT) {
    db = Object.assign(empty(), LEGACY_LOCAL);
    READY = true;
    save();
  } else {
    db = Object.assign(empty(), remote);
    READY = true;
  }
  try { render(); } catch (err) {}
});
window.parent.postMessage({ type: 'farmready', ft: FARM_FT, key: FARM_KEY }, '*');

// ---------- সাহায্যকারী ----------
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtDate = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => fmtDate(new Date());
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const bn = (n) => Number(n || 0).toLocaleString('bn-BD', { maximumFractionDigits: 2 });
const money = (n) => '৳ ' + Number(n || 0).toLocaleString('bn-BD', { maximumFractionDigits: 0 });
const sum = (arr, f) => arr.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const pondName = (id) => (db.ponds.find((p) => p.id === id) || {}).name || 'মুছে ফেলা পুকুর';

function pondFish(pid) {
  const stock = sum(db.stocks.filter((s) => s.pondId === pid), (s) => s.count);
  const dead = sum(db.health.filter((h) => h.pondId === pid), (h) => h.deaths);
  const sold = sum(db.sales.filter((s) => s.pondId === pid && s.mode === 'piece'), (s) => s.qty);
  return Math.max(0, stock - dead - sold);
}

function totals() {
  const ym = today().slice(0, 7);
  const feedIn = sum(db.feed.filter((f) => f.type === 'in'), (f) => f.kg);
  const feedOut = sum(db.feed.filter((f) => f.type === 'out'), (f) => f.kg);
  const totalSales = sum(db.sales, (s) => s.total);
  const feedCost = sum(db.feed.filter((f) => f.type === 'in'), (f) => f.price);
  const totalExp = sum(db.expenses, (e) => e.amount) + feedCost;
  return {
    ponds: db.ponds.length,
    fishNow: db.ponds.reduce((s, p) => s + pondFish(p.id), 0),
    feedStock: feedIn - feedOut, feedIn, feedOut, feedCost,
    monthSales: sum(db.sales.filter((s) => s.date && s.date.startsWith(ym)), (s) => s.total),
    totalSales, totalExp, profit: totalSales - totalExp,
  };
}

const WATER = {
  temp: { label: 'তাপমাত্রা', unit: '°C', lo: 25, hi: 32 },
  ph:   { label: 'pH', unit: '', lo: 6.5, hi: 8.5 },
  dox:  { label: 'অক্সিজেন (DO)', unit: 'mg/L', lo: 5, hi: 99 },
  amm:  { label: 'অ্যামোনিয়া', unit: 'mg/L', lo: 0, hi: 0.05 },
};
function chip(key, v) {
  if (v === null || v === undefined || v === '') return '<span class="note">—</span>';
  const r = WATER[key];
  const ok = Number(v) >= r.lo && Number(v) <= r.hi;
  return `<span class="chip ${ok ? 'ok' : 'bad'}">${bn(v)} ${r.unit} · ${ok ? 'ভালো' : 'সতর্ক'}</span>`;
}
function latestWater(pid) {
  return db.water.filter((w) => w.pondId === pid).sort((a, b) => b.date.localeCompare(a.date))[0];
}
function pondSelect() {
  if (!db.ponds.length) return '<select name="pondId" disabled><option>আগে একটি পুকুর যোগ করুন</option></select>';
  return '<select name="pondId" required><option value="">পুকুর নির্বাচন করুন</option>' +
    db.ponds.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('') + '</select>';
}

// ---------- ক্যালকুলেটর ----------
let calc = { disp: '0', acc: null, op: null, fresh: true };
const BN_DIGITS = '০১২৩৪৫৬৭৮৯';
const toBn = (s) => String(s).replace(/[0-9]/g, (d) => BN_DIGITS[d]);

function calcApply() {
  const a = calc.acc ?? 0, b = Number(calc.disp);
  let r;
  if (calc.op === '+') r = a + b;
  else if (calc.op === '−') r = a - b;
  else if (calc.op === '×') r = a * b;
  else if (calc.op === '÷') r = b === 0 ? NaN : a / b;
  else r = b;
  if (!isFinite(r)) { calc = { disp: 'ত্রুটি', acc: null, op: null, fresh: true }; return; }
  calc.acc = r;
  calc.disp = String(Math.round(r * 1e10) / 1e10);
}
function calcKey(k) {
  if (calc.disp === 'ত্রুটি' && k !== 'C') calc = { disp: '0', acc: null, op: null, fresh: true };
  if (/^[0-9]$/.test(k)) {
    calc.disp = calc.fresh || calc.disp === '0' ? k : calc.disp + k;
    calc.fresh = false;
  } else if (k === '.') {
    if (calc.fresh) { calc.disp = '0.'; calc.fresh = false; }
    else if (!calc.disp.includes('.')) calc.disp += '.';
  } else if (k === 'C') {
    calc = { disp: '0', acc: null, op: null, fresh: true };
  } else if (k === '⌫') {
    calc.disp = calc.disp.length > 1 ? calc.disp.slice(0, -1) : '0';
  } else if (['+', '−', '×', '÷'].includes(k)) {
    if (calc.op && !calc.fresh) calcApply(); else calc.acc = Number(calc.disp);
    calc.op = k; calc.fresh = true;
  } else if (k === '=') {
    if (calc.op) { calcApply(); calc.op = null; calc.fresh = true; }
  }
  const el = document.getElementById('calc-disp');
  if (el) el.textContent = toBn(calc.disp);
}
function calcHtml() {
  const rows = [
    ['C', '⌫', '÷', '×'],
    ['7', '8', '9', '−'],
    ['4', '5', '6', '+'],
    ['1', '2', '3'],
  ];
  const keyBtn = (k) => {
    const cls = ['+', '−', '×', '÷', 'C', '⌫'].includes(k) ? 'key op' : 'key';
    return `<button class="${cls}" data-calc="${k}" type="button">${toBn(k)}</button>`;
  };
  return `<div class="keys">
    ${rows.map((r) => r.map(keyBtn).join('')).join('')}
    <button class="key eq" data-calc="=" type="button">=</button>
    <button class="key zero" data-calc="0" type="button">০</button>
    <button class="key" data-calc="." type="button">.</button>
  </div>`;
}

const WEEK_BN = ['শনি', 'রবি', 'সোম', 'মঙ্গল', 'বুধ', 'বৃহ', 'শুক্র'];
const MONTHS = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
const MON_SHORT = ['জানু', 'ফেব্রু', 'মার্চ', 'এপ্রি', 'মে', 'জুন', 'জুলা', 'আগ', 'সেপ্টে', 'অক্টো', 'নভে', 'ডিসে'];
const PLBL = { week: 'সপ্তাহ', month: 'মাস', year: 'বছর' };
const PROG_SVG = '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="24" fill="none" stroke="#d9efe0" stroke-width="9"/><circle cx="32" cy="32" r="24" fill="none" stroke="#2e9d5a" stroke-width="9" stroke-linecap="round" stroke-dasharray="108 151" transform="rotate(-90 32 32)"/><circle cx="32" cy="32" r="11" fill="#e8f6ec"/><path d="M32 25 c4 5 5 8 5 10 a5 5 0 0 1 -10 0 c0 -2 1 -5 5 -10z" fill="#2e9d5a"/></svg>';
let prog = { period: 'week', anchor: (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })() };

function periodRange() {
  const a = new Date(prog.anchor);
  if (prog.period === 'week') {
    const s = new Date(a); s.setDate(a.getDate() - ((a.getDay() + 1) % 7));
    const e = new Date(s); e.setDate(s.getDate() + 6);
    return { start: s, end: e };
  }
  if (prog.period === 'month') return { start: new Date(a.getFullYear(), a.getMonth(), 1), end: new Date(a.getFullYear(), a.getMonth() + 1, 0) };
  return { start: new Date(a.getFullYear(), 0, 1), end: new Date(a.getFullYear(), 11, 31) };
}
function periodLabel() {
  const { start, end } = periodRange();
  if (prog.period === 'year') return toBn(start.getFullYear());
  if (prog.period === 'month') return `${MONTHS[start.getMonth()]} ${toBn(start.getFullYear())}`;
  const sameMonth = start.getMonth() === end.getMonth();
  return `${bn(start.getDate())} - ${bn(end.getDate())} ${sameMonth ? '' : MONTHS[start.getMonth()] + ' '}${MONTHS[end.getMonth()]} ${toBn(end.getFullYear())}`;
}
function inPeriod(dateStr) {
  if (!dateStr) return false;
  const { start, end } = periodRange();
  return dateStr >= fmtDate(start) && dateStr <= fmtDate(end);
}
function shiftPeriod(dir) {
  const a = new Date(prog.anchor);
  if (prog.period === 'week') a.setDate(a.getDate() + 7 * dir);
  else if (prog.period === 'month') a.setMonth(a.getMonth() + dir);
  else a.setFullYear(a.getFullYear() + dir);
  prog.anchor = a;
}
function progStats() {
  const { start, end } = periodRange();
  const sales = db.sales.filter((s) => inPeriod(s.date));
  const pieces = sum(sales.filter((s) => s.mode === 'piece'), (s) => s.qty);
  const kg = sum(sales.filter((s) => s.mode === 'kg'), (s) => s.qty);
  const revenue = sum(sales, (s) => s.total);
  const expenses = sum(db.expenses.filter((e) => inPeriod(e.date)), (e) => e.amount)
    + sum(db.feed.filter((f) => f.type === 'in' && inPeriod(f.date)), (f) => f.price);
  const dead = sum(db.health.filter((h) => inPeriod(h.date)), (h) => h.deaths);
  const feedKg = sum(db.feed.filter((f) => f.type === 'out' && inPeriod(f.date)), (f) => f.kg);
  const stocked = sum(db.stocks, (s) => s.count);
  const days = Math.round((end - start) / 864e5) + 1;
  return {
    pieces, kg, revenue, expenses, dead, feedKg, stocked, days,
    pct: stocked ? Math.min(100, Math.round(pieces / stocked * 100)) : 0,
    avg: revenue / days,
    profit: revenue - expenses,
    margin: revenue > 0 ? Math.round((revenue - expenses) / revenue * 100) : 0,
  };
}
function periodBuckets() {
  const { start, end } = periodRange();
  if (prog.period === 'week') {
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const key = fmtDate(d);
      return { label: WEEK_BN[i], value: sum(db.sales.filter((s) => s.date === key), (s) => s.total) };
    });
  }
  if (prog.period === 'month') {
    const y = start.getFullYear(), m = start.getMonth(), days = end.getDate();
    const n = Math.ceil(days / 7);
    return Array.from({ length: n }, (_, i) => {
      const from = fmtDate(new Date(y, m, 1 + i * 7));
      const to = fmtDate(new Date(y, m, Math.min(days, (i + 1) * 7)));
      return { label: 'সপ্তাহ ' + bn(i + 1), value: sum(db.sales.filter((s) => s.date >= from && s.date <= to), (s) => s.total) };
    });
  }
  const y = start.getFullYear();
  return MON_SHORT.map((label, m) => {
    const key = y + '-' + String(m + 1).padStart(2, '0');
    return { label, value: sum(db.sales.filter((s) => s.date && s.date.startsWith(key)), (s) => s.total) };
  });
}
const shortNum = (n) => (n >= 1000 ? bn((n / 1000).toFixed(1)) + 'k' : bn(n));
function barsTitle() {
  return prog.period === 'week' ? 'দৈনিক বিক্রয় (৳)' : prog.period === 'month' ? 'সাপ্তাহিক বিক্রয় (৳)' : 'মাসভিত্তিক বিক্রয় (৳)';
}

  pond() {
    return `
    <section class="card">
      <h2 class="sec">নতুন পুকুর যোগ করুন</h2>
      <form class="form" data-form="pond">
        <label class="f full">পুকুরের নাম<input name="name" required placeholder="যেমন: উত্তরের পুকুর"></label>
        <label class="f">আয়তন (শতাংশ)<input name="area" type="number" step="any" min="0" inputmode="decimal"></label>
        <label class="f">গভীরতা (ফুট)<input name="depth" type="number" step="any" min="0" inputmode="decimal"></label>
        <label class="f full">যোগ করার তারিখ<input name="date" type="date" value="${today()}" required></label>
        <div class="full"><button class="btn" type="submit">পুকুর যোগ করুন</button></div>
      </form>
    </section>
    <section class="card section">
      <h2 class="sec">পুকুরের তালিকা</h2>
      ${db.ponds.length ? `<div class="list">${db.ponds.map((p) => `
        <div class="item">
          <div class="main">
            <b>${esc(p.name)}</b>
            <div class="meta">${p.area ? bn(p.area) + ' শতাংশ' : 'আয়তন দেওয়া নেই'}${p.depth ? ' · গভীরতা ' + bn(p.depth) + ' ফুট' : ''} · এখন মাছ: ${bn(pondFish(p.id))}</div>
          </div>
          ${delBtn('pond', p.id)}
        </div>`).join('')}</div>`
        : '<div class="empty">এখনো কোনো পুকুর যোগ করা হয়নি।</div>'}
      <p class="note">পুকুর মুছলে এর মাছ, খাবার-পানি ও স্বাস্থ্যের তথ্যও মুছে যাবে। বিক্রয়ের হিসাব থাকবে।</p>
    </section>`;
  },

  fish() {
    return `
    <section class="card">
      <h2 class="sec">মাছের তথ্য যোগ করুন</h2>
      <form class="form" data-form="stock">
        <label class="f full">পুকুর${pondSelect()}</label>
        <label class="f">মাছের প্রজাতি<input name="species" placeholder="যেমন: রুই, কাতলা, তেলাপিয়া"></label>
        <label class="f">তারিখ<input name="date" type="date" value="${today()}" required></label>
        <div class="full">
          <div class="pills">
            <label class="pill"><input type="radio" name="unit" value="piece" checked><span>পিস হিসাবে</span></label>
            <label class="pill"><input type="radio" name="unit" value="kg"><span>কেজি হিসাবে</span></label>
          </div>
        </div>
        <label class="f"><span data-sqlabel>মাছের সংখ্যা (পিস)</span><input name="qty" type="number" min="0" step="any" required inputmode="decimal"></label>
        <label class="f">গড় ওজন প্রতি পিস (কেজি)<input name="avgKg" type="number" min="0" step="any" required inputmode="decimal"></label>
        <div class="full">
          <div class="pills">
            <label class="pill"><input type="radio" name="basis" value="piece" checked><span>প্রতি পিস দাম</span></label>
            <label class="pill"><input type="radio" name="basis" value="kg"><span>প্রতি কেজি দাম</span></label>
          </div>
        </div>
        <label class="f full"><span data-spbasis>প্রতি পিস দাম (৳)</span><input name="price" type="number" min="0" step="any" inputmode="decimal" placeholder="না দিলে মূল্য ধরা হবে না"></label>
        <div class="full preview">
          <div class="calc" data-spcalc>০ পিস · ০ কেজি</div>
          <div class="amt" data-spamt>৳ ০</div>
        </div>
        <div class="full"><button class="btn" type="submit">যোগ করুন</button></div>
      </form>

// ---------- বিক্রয় হিসাব (পিস / কেজি) ----------
function updateSale(form) {
  if (!form) return;
  const mode = form.querySelector('input[name="mode"]:checked').value;
  const qty = Number(form.qty.value) || 0;
  const unit = Number(form.unit.value) || 0;
  form.querySelector('[data-qlabel]').textContent = mode === 'piece' ? 'বিক্রীত মাছ (পিস)' : 'বিক্রীত ওজন (কেজি)';
  form.querySelector('[data-ulabel]').textContent = mode === 'piece' ? 'প্রতি পিস দাম (৳)' : 'প্রতি কেজি দাম (৳)';
  form.querySelector('[data-calc]').textContent = mode === 'piece'
    ? `${bn(qty)} পিস × ${money(unit)} = `
    : `${bn(qty)} কেজি × ${money(unit)} = `;
  form.querySelector('[data-amt]').textContent = money(qty * unit);
  const rec = Number(form.received ? form.received.value : 0) || 0;
  const dueEl = form.querySelector('[data-due]');
  if (dueEl) dueEl.textContent = money(Math.max(0, qty * unit - rec));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2000);
}

function updateStock(form) {
  if (!form) return;
  const unit = form.querySelector('input[name="unit"]:checked').value;
  const basis = form.querySelector('input[name="basis"]:checked').value;
  form.querySelector('[data-sqlabel]').textContent = unit === 'piece' ? 'মাছের সংখ্যা (পিস)' : 'মোট ওজন (কেজি)';
  form.querySelector('[data-spbasis]').textContent = basis === 'piece' ? 'প্রতি পিস দাম (৳)' : 'প্রতি কেজি দাম (৳)';
  const qty = Number(form.qty.value) || 0;
  const avg = Number(form.avgKg.value) || 0;
  const price = Number(form.price.value) || 0;
  const count = unit === 'piece' ? qty : (avg > 0 ? Math.round(qty / avg) : 0);
  const kg = unit === 'piece' ? qty * avg : qty;
  const value = basis === 'piece' ? count * price : kg * price;
  form.querySelector('[data-spcalc]').textContent = `${bn(count)} পিস · ${bn(kg)} কেজি`;
  form.querySelector('[data-spamt]').textContent = money(value);
}
function updateFeed(form) {
  if (!form) return;
  const picked = form.querySelector('input[name="unit"]:checked');
  const unit = picked ? picked.value : '';
  const qty = Number(form.qty.value) || 0;
  const bag = Number(form.bagKg.value) || 0;
  const kg = unit === 'bag' ? qty * bag : qty;
  form.querySelector('[data-fqlabel]').textContent = unit === 'bag' ? 'বস্তার সংখ্যা' : unit === 'kg' ? 'কেজির পরিমাণ' : 'পরিমাণ';
  form.querySelector('[data-fcalc]').textContent = !unit
    ? 'কেজি না বস্তা, আগে বেছে নিন'
    : unit === 'bag' ? `${bn(qty)} বস্তা × ${bn(bag)} কেজি = ` : `${bn(qty)} কেজি`;
  form.querySelector('[data-famt]').textContent = unit ? `${bn(kg)} কেজি` : '—';
}

// ---------- ফর্ম সেভ ----------
const HANDLERS = {
  pond(d) {
    if (!d.name.trim()) return false;
    db.ponds.push({ id: uid(), name: d.name.trim(), area: Number(d.area) || 0, depth: Number(d.depth) || 0, date: d.date || today() });
  },
  stock(d) {
    const avg = Number(d.avgKg), qty = Number(d.qty), price = Number(d.price) || 0;
    if (!d.pondId || !(avg > 0) || !(qty > 0)) return false;
    const count = d.unit === 'piece' ? qty : Math.round(qty / avg);
    const kg = d.unit === 'piece' ? qty * avg : qty;
    const value = d.basis === 'piece' ? count * price : kg * price;
    db.stocks.push({ id: uid(), pondId: d.pondId, species: (d.species || '').trim(), unit: d.unit, qty, avgKg: avg,
      count, kg, basis: d.basis, price, value, date: d.date || today() });
  },
  feed(d) {
    const qty = Number(d.qty), bag = Number(d.bagKg) || 0;
    if (!d.unit || !(qty > 0)) return false;
    if (d.unit === 'bag' && !(bag > 0)) return false;
    const kg = d.unit === 'bag' ? qty * bag : qty;
    db.feed.push({ id: uid(), type: d.type, unit: d.unit, qty, bagKg: d.unit === 'bag' ? bag : 0, kg,
      price: d.type === 'in' ? (Number(d.price) || 0) : 0, date: d.date || today() });
  },
  water(d) {
    if (!d.pondId) return false;
    const num = (v) => (v === '' || v === undefined ? null : Number(v));
    db.water.push({ id: uid(), pondId: d.pondId, temp: num(d.temp), ph: num(d.ph), dox: num(d.dox), amm: num(d.amm), date: d.date || today() });
  },
  health(d) {
    if (!d.pondId) return false;
    db.health.push({ id: uid(), pondId: d.pondId, type: d.type, deaths: Number(d.deaths) || 0, medicine: (d.medicine || '').trim(), note: (d.note || '').trim(), date: d.date || today() });
  },
  sale(d) {
    const qty = Number(d.qty), unit = Number(d.unit);
    if (!d.pondId || !(qty > 0) || !(unit >= 0)) return false;
    const received = Number(d.received) || 0;
    if (received < 0) return false;
    const total = qty * unit;
    db.sales.push({ id: uid(), pondId: d.pondId, mode: d.mode, qty, unit, total, received, due: Math.max(0, total - received), date: d.date || today() });
  },
  note(d) {
    if (!(d.text || '').trim()) return false;
    db.notes.push({ id: uid(), title: (d.title || '').trim(), text: d.text.trim(), date: d.date || today() });
  },
  expense(d) {
    const amount = Number(d.amount);
    if (!(amount > 0)) return false;
    db.expenses.push({ id: uid(), item: (d.item || '').trim(), amount, date: d.date || today() });
  },
};
const LISTS = { stock: 'stocks', feed: 'feed', health: 'health', water: 'water', sale: 'sales', expense: 'expenses', note: 'notes' };

function removeItem(kind, id) {
  if (kind === 'pond') {
    db.ponds = db.ponds.filter((p) => p.id !== id);
    db.stocks = db.stocks.filter((s) => s.pondId !== id);
    db.health = db.health.filter((h) => h.pondId !== id);
    db.water = db.water.filter((w) => w.pondId !== id);
  } else {
    const key = LISTS[kind];
    db[key] = db[key].filter((x) => x.id !== id);
  }
  save();
}

// ---------- পাতা চালানো ----------
let view = 'home';
const app = document.getElementById('app');
const titleEl = document.getElementById('title');
const backBtn = document.getElementById('back');

function render() {
  titleEl.textContent = TITLES[view];
  backBtn.hidden = view === 'home';
  // উপরের বার শুধু প্রথম (ড্যাশবোর্ড) পাতায়
  const hdrBar = document.getElementById('hdr-bar');
  if (hdrBar) hdrBar.style.display = view === 'home' ? '' : 'none';
  app.innerHTML = VIEWS[view]();
  // ভেতরের পাতায় হোম বোতাম (লেয়ারের মতো)
  if (view !== 'home') app.insertAdjacentHTML('afterbegin', '<div class="hp-wrap"><button class="hp" type="button" data-hp="home"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>হোম</span></button></div>');
  if (view === 'finance') updateSale(app.querySelector('form[data-form="sale"]'));
  if (view === 'fish') updateStock(app.querySelector('form[data-form="stock"]'));
  if (view === 'feed') updateFeed(app.querySelector('form[data-form="feed"]'));
}
function go(name, fromHistory) {
  name = name in VIEWS ? name : 'home';
  const cur = history.state && history.state.view;
  if (!fromHistory) {
    // কোনো পাতা থেকে হোমে ফেরা = এক ধাপ ব্যাক
    if (name === 'home' && cur && cur !== 'home') { history.back(); return; }
    if (name !== 'home') {
      if (cur === 'home') history.pushState({ view: name }, '');
      else history.replaceState({ view: name }, '');
    }
  }
  view = name;
  window.scrollTo(0, 0);
  render();
}

// ---------- ব্যাক বাটন: হোমে দুইবার চাপলে তবেই অ্যাপ থেকে বের ----------
// history: [guard] -> [home] -> [পাতা...]
history.replaceState({ guard: true }, '');
history.pushState({ view: 'home' }, '');
let exitArmed = false;
window.addEventListener('popstate', (e) => {
  const st = e.state || {};
  if (st.guard) {
    // হোম থেকে ব্যাক চাপা হয়েছে
    if (exitArmed) { history.back(); return; } // দ্বিতীয়বার: বের হয়ে যাবে
    exitArmed = true;
    showToast('আবার ব্যাক চাপলে অ্যাপ থেকে বের হবে');
    setTimeout(() => { exitArmed = false; }, 2000);
    history.pushState({ view: 'home' }, '');
    go('home', true);
    return;
  }
  go(st.view || 'home', true);
});
backBtn.addEventListener('click', () => go('home'));

document.addEventListener('click', (e) => {
  if (e.target.closest && e.target.closest('[data-hp]')) { go('home'); return; }
  const goEl = e.target.closest('[data-go]');
  if (goEl && goEl.classList.contains('tile')) {
    goEl.classList.add('pressed');
    const target = goEl.dataset.go;
    return setTimeout(() => go(target), 170);
  }
  if (goEl) return go(goEl.dataset.go);

  const del = e.target.closest('[data-del]');
  if (del) {
    const msg = del.dataset.del === 'pond'
      ? 'এই পুকুর ও এর মাছ, খাবার-পানি-স্বাস্থ্যের তথ্য মুছে যাবে। নিশ্চিত?'
      : 'এই রেকর্ডটি মুছে যাবে। নিশ্চিত?';
    if (!confirm(msg)) return;
    removeItem(del.dataset.del, del.dataset.id);
    return render();
  }
  const pb = e.target.closest('[data-prog]');
  if (pb) { prog.period = pb.dataset.prog; return render(); }
  const nb = e.target.closest('[data-nav]');
  if (nb) { shiftPeriod(Number(nb.dataset.nav)); return render(); }
  const ck = e.target.closest('[data-calc]');
  if (ck) return calcKey(ck.dataset.calc);
  if (e.target.closest('[data-action="print"]')) window.print();
  if (e.target.closest('[data-action="ai"]')) showToast('AI সহকারী শীঘ্রই আসছে');
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  if (HANDLERS[form.dataset.form](data) === false) { alert('তথ্যগুলো ঠিকভাবে দিন।'); return; }
  save();
  render();
});
document.addEventListener('input', (e) => {
  const form = e.target.closest('form[data-form]');
  if (form) refreshPreview(form);
  updateHelper(e.target.closest('[data-helper]'));
});
document.addEventListener('change', (e) => {
  const form = e.target.closest('form[data-form]');
  if (form) refreshPreview(form);
});
function refreshPreview(form) {
  const name = form.dataset.form;
  if (name === 'sale') updateSale(form);
  if (name === 'stock') updateStock(form);
  if (name === 'feed') updateFeed(form);
}

render();

// AI ব্যানারে ক্লিক করলে এখন শীঘ্রই আসছে বার্তা (AI পরে যুক্ত হবে)
document.addEventListener('click', (e) => {
  if (e.target && e.target.closest && e.target.closest('.ai-banner')) {
    e.preventDefault(); e.stopPropagation();
    if (typeof showToast === 'function') showToast('শীঘ্রই আসছে');
  }
}, true);
    /* উপরের বার: মূল অ্যাপ থেকে তথ্য নেয়, বোতামের কাজ মূল অ্যাপে পাঠায় */
    (function () {
      const nameEl = document.getElementById('hb-name');
      const roleEl = document.getElementById('hb-role');
      const avEl = document.getElementById('hb-avatar');
      const selEl = document.getElementById('hb-farm');
      function fillBar(d) {
        nameEl.textContent = d.name || '';
        roleEl.textContent = d.roleLabel || '';
        avEl.innerHTML = '';
        if (d.photo) { const im = document.createElement('img'); im.src = d.photo; im.alt = ''; avEl.appendChild(im); }
        else { avEl.textContent = (d.name || '?').trim().charAt(0); }
        selEl.innerHTML = '';
        (d.farms || []).forEach(f => {
          const o = document.createElement('option');
          o.value = f.id; o.textContent = f.name || '';
          if (f.id === d.current) o.selected = true;
          selEl.appendChild(o);
        });
      }
      document.querySelectorAll('#hdr-bar [data-hb]').forEach(b => {
        b.addEventListener('click', () => window.parent.postMessage({ type: 'hdraction', action: b.getAttribute('data-hb') }, '*'));
      });
      selEl.addEventListener('change', () => window.parent.postMessage({ type: 'hdraction', action: 'farm', value: selEl.value }, '*'));
      window.addEventListener('message', (e) => {
        if (e.source !== window.parent || !e.data || e.data.type !== 'hdrdata') return;
        fillBar(e.data);
      });
      window.parent.postMessage({ type: 'hdrready' }, '*');
    })();
</script>
